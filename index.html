<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraFit Pro</title>
  <style>
    :root {
      --bg-main: #0d0f14;
      --bg-card: #161a23;
      --bg-hover: #212735;
      --accent-cyan: #00f2fe;
      --accent-green: #00e676;
      --accent-purple: #7c4dff;
      --accent-orange: #ffab00;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --border-color: #2a3245;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); padding-bottom: 90px; }

    /* Header & Nav */
    header { background: var(--bg-card); padding: 16px; text-align: center; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; }
    header h1 { font-size: 1.4rem; color: var(--accent-cyan); letter-spacing: 1px; }

    .nav-tabs { display: flex; justify-content: space-around; background: var(--bg-card); padding: 10px; border-bottom: 1px solid var(--border-color); }
    .tab-btn { background: none; border: 1px solid transparent; color: var(--text-muted); font-size: 0.85rem; font-weight: 600; padding: 8px 16px; cursor: pointer; border-radius: var(--radius); transition: all 0.2s ease; }
    .tab-btn.active { color: var(--bg-main); background: var(--accent-cyan); border-color: var(--accent-cyan); }

    .container { max-width: 600px; margin: 0 auto; padding: 16px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Preset Switcher Bar */
    .preset-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    .preset-btn { flex: 1; padding: 10px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main); border-radius: var(--radius); font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .preset-btn:hover { background: var(--bg-hover); border-color: var(--accent-cyan); }

    /* Cards & Layout */
    .card { background: var(--bg-card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    .card-title { font-size: 1.1rem; margin-bottom: 12px; color: var(--accent-cyan); display: flex; justify-content: space-between; align-items: center; }

    /* Readiness Index */
    .metric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .metric-box { background: var(--bg-main); padding: 10px; border-radius: 8px; text-align: center; }
    .metric-box label { font-size: 0.75rem; color: var(--text-muted); display: block; margin-bottom: 4px; }
    .metric-box input, .metric-box select { width: 100%; background: transparent; border: none; color: var(--text-main); text-align: center; font-weight: bold; font-size: 0.9rem; }
    
    .readiness-score-bar { background: var(--bg-main); height: 10px; border-radius: 5px; overflow: hidden; margin-top: 8px; }
    .readiness-score-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff4949, var(--accent-orange), var(--accent-green)); transition: width 0.3s ease; }

    /* Exercise & Set Rows */
    .exercise-card { background: var(--bg-card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    .exercise-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .tag { font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; background: rgba(0, 242, 254, 0.15); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }

    .set-row { display: grid; grid-template-columns: 32px 42px 1fr 1fr 1fr 32px; gap: 8px; align-items: center; margin-bottom: 8px; }
    .set-row input { background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); padding: 6px; border-radius: 6px; text-align: center; font-size: 0.85rem; }
    .set-row input:focus { outline: 1px solid var(--accent-cyan); }

    .check-btn { width: 32px; height: 32px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--accent-green); cursor: pointer; font-weight: bold; }
    .check-btn.completed { background: var(--accent-green); color: var(--bg-main); border-color: var(--accent-green); }

    .type-badge { font-size: 0.7rem; font-weight: bold; text-align: center; padding: 6px 0; border-radius: 6px; cursor: pointer; user-select: none; }
    .type-badge.working { background: rgba(124, 77, 255, 0.2); color: var(--accent-purple); border: 1px solid var(--accent-purple); }
    .type-badge.warmup { background: rgba(255, 171, 0, 0.2); color: var(--accent-orange); border: 1px solid var(--accent-orange); }

    .btn-remove-set { background: none; border: none; color: #ff4949; font-size: 0.9rem; cursor: pointer; }
    .btn-add-set { width: 100%; padding: 8px; background: var(--bg-hover); border: 1px dashed var(--border-color); color: var(--text-muted); border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-top: 8px; }

    /* Rest Timer Bar */
    .timer-banner { position: fixed; bottom: 0; left: 0; right: 0; background: #121620; border-top: 1px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .timer-display { font-size: 1.2rem; font-weight: bold; color: var(--accent-cyan); font-family: monospace; }
    .timer-btn { background: var(--border-color); color: var(--text-main); border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-left: 6px; font-size: 0.8rem; }

    /* Analytics Progress Bars */
    .progress-group { margin-bottom: 12px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .progress-track { background: var(--bg-main); height: 8px; border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent-cyan); }
  </style>
</head>
<body>

  <header>
    <h1>AURAFIT PRO</h1>
  </header>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('journal', event)">Journal</button>
    <button class="tab-btn" onclick="switchTab('workout', event)">Workout</button>
    <button class="tab-btn" onclick="switchTab('analytics', event)">Analytics</button>
  </div>

  <div class="container">

    <!-- JOURNAL TAB -->
    <div id="journal" class="tab-content active">
      <div class="card">
        <div class="card-title">
          <span>Daily Readiness Index</span>
          <span id="readiness-score-text" style="font-weight:bold;">0%</span>
        </div>
        <div class="metric-grid">
          <div class="metric-box">
            <label>Sleep (Hrs)</label>
            <input type="number" id="readiness-sleep" value="7.5" step="0.5" oninput="calculateReadiness()">
          </div>
          <div class="metric-box">
            <label>Energy (1-10)</label>
            <input type="number" id="readiness-energy" value="7" min="1" max="10" oninput="calculateReadiness()">
          </div>
          <div class="metric-box">
            <label>Nutrition</label>
            <select id="readiness-nutrition" onchange="calculateReadiness()">
              <option value="1">Optimal</option>
              <option value="0.7">Moderate</option>
              <option value="0.4">Poor</option>
            </select>
          </div>
        </div>
        <div class="readiness-score-bar">
          <div id="readiness-fill" class="readiness-score-fill"></div>
        </div>
        <p id="readiness-hint" style="font-size:0.78rem; color:var(--text-muted); margin-top:8px; text-align:center;">Calculating recommendation...</p>
      </div>
    </div>

    <!-- WORKOUT TAB -->
    <div id="workout" class="tab-content">
      <div class="preset-bar">
        <button class="preset-btn" onclick="loadPreset('morningHome')">☀️ Morning Home (30m)</button>
        <button class="preset-btn" onclick="loadPreset('eveningGym')">🌙 Evening Gym (60m)</button>
      </div>
      <div id="exercise-list"></div>
    </div>

    <!-- ANALYTICS TAB -->
    <div id="analytics" class="tab-content">
      <div class="card">
        <div class="card-title">Weekly Focus Distribution</div>
        
        <div class="progress-group">
          <div class="progress-label"><span>Mobility & Posture</span><span>35%</span></div>
          <div class="progress-track"><div class="progress-fill" style="width: 35%;"></div></div>
        </div>
        
        <div class="progress-group">
          <div class="progress-label"><span>Core & Stability</span><span>25%</span></div>
          <div class="progress-track"><div class="progress-fill" style="width: 25%; background: var(--accent-purple);"></div></div>
        </div>

        <div class="progress-group">
          <div class="progress-label"><span>Stamina & Hypertrophy</span><span>40%</span></div>
          <div class="progress-track"><div class="progress-fill" style="width: 40%; background: var(--accent-green);"></div></div>
        </div>
      </div>
    </div>

  </div>

  <!-- REST TIMER BAR -->
  <div class="timer-banner">
    <div>
      <span style="font-size:0.75rem; color:var(--text-muted); display:block;">REST TIMER</span>
      <span id="timer-display" class="timer-display">00:00</span>
    </div>
    <div>
      <button class="timer-btn" onclick="addTimerSeconds(30)">+30s</button>
      <button class="timer-btn" onclick="stopTimer()">Skip</button>
    </div>
  </div>

  <script>
    // Presets for Split Routine
    const routinePresets = {
      morningHome: [
        {
          name: "Thoracic Spine & World's Greatest Stretch",
          tag: "Posture/Mobility",
          sets: [
            { type: 'working', weight: '0', reps: '10', rpe: '5', done: false },
            { type: 'working', weight: '0', reps: '10', rpe: '5', done: false }
          ]
        },
        {
          name: "Deadbug / Bird-Dog Holds",
          tag: "Core/Stability",
          sets: [
            { type: 'working', weight: '0', reps: '12', rpe: '6', done: false },
            { type: 'working', weight: '0', reps: '12', rpe: '7', done: false }
          ]
        },
        {
          name: "Banded Glute Bridges & Clamshells",
          tag: "Hip Stability",
          sets: [
            { type: 'working', weight: '0', reps: '15', rpe: '6', done: false },
            { type: 'working', weight: '0', reps: '15', rpe: '7', done: false }
          ]
        }
      ],
      eveningGym: [
        {
          name: "Goblet Squats (Pause & Depth)",
          tag: "Lower/Stability",
          sets: [
            { type: 'warmup', weight: '12', reps: '10', rpe: '5', done: false },
            { type: 'working', weight: '20', reps: '10', rpe: '7', done: false },
            { type: 'working', weight: '24', reps: '8', rpe: '8', done: false }
          ]
        },
        {
          name: "Cable Face Pulls & Y-Raises",
          tag: "Posture/Upper",
          sets: [
            { type: 'working', weight: '15', reps: '15', rpe: '7', done: false },
            { type: 'working', weight: '17.5', reps: '12', rpe: '8', done: false }
          ]
        },
        {
          name: "Farmers Carry / Suitcase Hold",
          tag: "Core/Stamina",
          sets: [
            { type: 'working', weight: '16', reps: '45', rpe: '8', done: false },
            { type: 'working', weight: '20', reps: '40', rpe: '9', done: false }
          ]
        }
      ]
    };

    let exerciseSetsState = routinePresets.morningHome;
    let timerInterval = null;
    let timerSecondsLeft = 0;

    // --- Tab Switching ---
    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      if (evt && evt.target) evt.target.classList.add('active');
    }

    // --- Load Preset Routine ---
    function loadPreset(presetKey) {
      if (routinePresets[presetKey]) {
        exerciseSetsState = JSON.parse(JSON.stringify(routinePresets[presetKey]));
        renderExercises();
      }
    }

    // --- Readiness Calculation ---
    function calculateReadiness() {
      const sleep = parseFloat(document.getElementById('readiness-sleep').value) || 0;
      const energy = parseFloat(document.getElementById('readiness-energy').value) || 0;
      const nutrition = parseFloat(document.getElementById('readiness-nutrition').value) || 0;

      const sleepScore = Math.min((sleep / 8) * 40, 40);
      const energyScore = (energy / 10) * 40;
      const nutritionScore = nutrition * 20;

      const total = Math.min(Math.round(sleepScore + energyScore + nutritionScore), 100);

      document.getElementById('readiness-score-text').innerText = `${total}%`;
      document.getElementById('readiness-fill').style.width = `${total}%`;

      const hint = document.getElementById('readiness-hint');
      if (total >= 80) hint.innerText = "Prime condition: Push for quality depth and weight progression.";
      else if (total >= 60) hint.innerText = "Moderate readiness: Stick to scheduled working reps.";
      else hint.innerText = "Low readiness: Consider dropping 1 working set per movement.";
    }

    // --- Exercise & Set Rendering ---
    function renderExercises() {
      const list = document.getElementById('exercise-list');
      if (!list) return;
      list.innerHTML = '';

      exerciseSetsState.forEach((ex, exIndex) => {
        const card = document.createElement('div');
        card.className = 'exercise-card';
        card.innerHTML = `
          <div class="exercise-header">
            <strong>${ex.name}</strong>
            <span class="tag">${ex.tag}</span>
          </div>
          <div class="set-row" style="font-size:0.7rem; color:var(--text-muted); text-align:center; font-weight:bold;">
            <span>DONE</span><span>TYPE</span><span>KG/LBS</span><span>REPS</span><span>RPE</span><span></span>
          </div>
          <div id="sets-container-${exIndex}"></div>
          <button class="btn-add-set" onclick="addSetRow(${exIndex}, 'working')">+ Add Working Set</button>
        `;
        list.appendChild(card);
        renderSetRowsForExercise(exIndex);
      });
    }

    function renderSetRowsForExercise(exIndex) {
      const container = document.getElementById(`sets-container-${exIndex}`);
      if (!container) return;
      const sets = exerciseSetsState[exIndex].sets || [];

      let html = '';
      sets.forEach((setObj, s) => {
        const weight = parseFloat(setObj.weight) || 0;
        const reps = parseInt(setObj.reps) || 0;
        // Estimated 1RM calculation (Epley)
        const e1rm = (weight > 0 && reps > 0) ? Math.round(weight * (1 + reps / 30)) : 0;

        html += `
          <div class="set-row">
            <button class="check-btn ${setObj.done ? 'completed' : ''}" onclick="toggleSetDone(${exIndex}, ${s})">
              ${setObj.done ? '✓' : ''}
            </button>
            <div class="type-badge ${setObj.type}" onclick="toggleSetType(${exIndex}, ${s})">
              ${setObj.type === 'warmup' ? 'W' : 'WK'}
            </div>
            <input type="number" placeholder="kg" value="${setObj.weight}" oninput="updateSetData(${exIndex}, ${s}, 'weight', this.value)">
            <input type="number" placeholder="Reps" value="${setObj.reps}" oninput="updateSetData(${exIndex}, ${s}, 'reps', this.value)">
            <input type="number" placeholder="RPE" value="${setObj.rpe}" oninput="updateSetData(${exIndex}, ${s}, 'rpe', this.value)">
            <button class="btn-remove-set" onclick="removeSetRow(${exIndex}, ${s})">✕</button>
          </div>
          ${e1rm > 0 ? `<div style="font-size:0.68rem; color:var(--accent-cyan); text-align:right; margin:-4px 36px 6px 0; font-weight:700;">Est. 1RM: ${e1rm}</div>` : ''}
        `;
      });

      container.innerHTML = html;
      saveDraft();
    }

    function toggleSetDone(exIndex, setIndex) {
      const set = exerciseSetsState[exIndex].sets[setIndex];
      set.done = !set.done;
      if (set.done) {
        startTimer(60); // Auto-starts a 60s timer on set completion
      }
      renderSetRowsForExercise(exIndex);
    }

    function updateSetData(exIndex, setIndex, field, value) {
      exerciseSetsState[exIndex].sets[setIndex][field] = value;
      if (field === 'weight' || field === 'reps') {
        renderSetRowsForExercise(exIndex);
      } else {
        saveDraft();
      }
    }

    function toggleSetType(exIndex, setIndex) {
      const current = exerciseSetsState[exIndex].sets[setIndex].type;
      exerciseSetsState[exIndex].sets[setIndex].type = current === 'working' ? 'warmup' : 'working';
      renderSetRowsForExercise(exIndex);
    }

    function addSetRow(exIndex, type) {
      exerciseSetsState[exIndex].sets.push({ type, weight: '', reps: '', rpe: '', done: false });
      renderSetRowsForExercise(exIndex);
    }

    function removeSetRow(exIndex, setIndex) {
      exerciseSetsState[exIndex].sets.splice(setIndex, 1);
      renderSetRowsForExercise(exIndex);
    }

    // --- Timer Controls ---
    function startTimer(seconds) {
      clearInterval(timerInterval);
      timerSecondsLeft = seconds;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timerSecondsLeft--;
        updateTimerDisplay();

        if (timerSecondsLeft <= 0) {
          clearInterval(timerInterval);
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
      }, 1000);
    }

    function addTimerSeconds(sec) {
      timerSecondsLeft += sec;
      updateTimerDisplay();
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerSecondsLeft = 0;
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(Math.max(0, timerSecondsLeft) / 60);
      const secs = Math.max(0, timerSecondsLeft) % 60;
      document.getElementById('timer-display').innerText = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // --- Persistence ---
    function saveDraft() {
      localStorage.setItem('aurafit_workout_draft', JSON.stringify(exerciseSetsState));
    }

    function loadDraft() {
      const saved = localStorage.getItem('aurafit_workout_draft');
      if (saved) {
        try { exerciseSetsState = JSON.parse(saved); } catch (e) {}
      }
    }

    // --- Initialization ---
    window.onload = () => {
      loadDraft();
      calculateReadiness();
      renderExercises();
    };
  </script>
</body>
</html>
