<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Mobility & Stability</title>
    <style>
        :root {
            --bg: #121212; --card: #1e1e1e; --text: #f0f0f0; 
            --accent: #4ade80; --accent-dim: rgba(74, 222, 128, 0.2);
            --border: #333; --gray: #999;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
        
        header { padding: 20px; text-align: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg); z-index: 10; }
        h1 { font-size: 1.2rem; margin-bottom: 10px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; }
        select, button { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 10px 15px; border-radius: 8px; font-size: 1rem; outline: none; }
        
        .tabs { display: flex; margin: 20px; background: var(--card); border-radius: 10px; overflow: hidden; }
        .tab { flex: 1; padding: 12px; text-align: center; font-weight: 600; color: var(--gray); transition: 0.2s; }
        .tab.active { background: var(--accent-dim); color: var(--accent); }
        
        .list-container { padding: 0 20px; }
        .phase-title { margin: 20px 0 10px 0; font-size: 0.9rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        
        .exercise { background: var(--card); margin-bottom: 10px; padding: 15px; border-radius: 10px; display: flex; align-items: center; border: 1px solid var(--border); transition: 0.2s; }
        .exercise.completed { opacity: 0.5; border-color: var(--accent); }
        .exercise.completed .name { text-decoration: line-through; }
        
        .checkbox { width: 24px; height: 24px; border: 2px solid var(--gray); border-radius: 50%; margin-right: 15px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .exercise.completed .checkbox { border-color: var(--accent); background: var(--accent); }
        .exercise.completed .checkbox::after { content: "✓"; color: #000; font-size: 14px; font-weight: bold; }
        
        .details { flex: 1; }
        .name { font-weight: 600; font-size: 1rem; margin-bottom: 4px; display: block; }
        .reps { font-size: 0.85rem; color: var(--gray); }
        
        .progress-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); padding: 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 15px; }
        .track { flex: 1; height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
        .fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
        
        #resetBtn { background: transparent; border: none; color: var(--gray); font-size: 0.8rem; text-decoration: underline; margin-top: 20px; width: 100%; text-align: center; padding-bottom: 20px;}
    </style>
</head>
<body>

    <header>
        <h1>Foundation Builder</h1>
        <div class="controls">
            <select id="daySelect" onchange="renderView()">
                <option value="1">Day 1 (Lower)</option>
                <option value="2">Day 2 (Upper)</option>
                <option value="3">Day 3 (Core/HIIT)</option>
                <option value="4">Day 4 (Lower)</option>
                <option value="5">Day 5 (Upper)</option>
                <option value="6">Day 6 (Full Circuit)</option>
                <option value="7">Day 7 (Rest)</option>
            </select>
        </div>
    </header>

    <div class="tabs">
        <div class="tab active" id="tab-morning" onclick="setSession('morning')">☀️ Morning (30m)</div>
        <div class="tab" id="tab-evening" onclick="setSession('evening')">🌙 Evening (60m)</div>
    </div>

    <div class="list-container" id="workoutList"></div>
    <button id="resetBtn" onclick="resetProgress()">Reset Progress for this Day</button>

    <div class="progress-bar">
        <div style="font-size: 0.9rem; font-weight: bold;" id="progressText">0%</div>
        <div class="track"><div class="fill" id="progressFill"></div></div>
    </div>

    <script>
        const morningRoutine = [
            { phase: "Dynamic Mobility", name: "Cat-Cow Stretch", reps: "2 sets, 10 reps" },
            { phase: "Dynamic Mobility", name: "Thoracic Rotations", reps: "2 sets, 8 reps/side" },
            { phase: "Dynamic Mobility", name: "World's Greatest Stretch", reps: "5 reps/leg" },
            { phase: "Dynamic Mobility", name: "Hip 90/90s", reps: "2 sets, 10 rolls" },
            { phase: "Posture & Core", name: "Wall Angels", reps: "2 sets, 15 reps" },
            { phase: "Posture & Core", name: "Bird-Dog", reps: "2 sets, 12 reps/side" },
            { phase: "Posture & Core", name: "Dead Bugs", reps: "2 sets, 12 reps/side" },
            { phase: "Posture & Core", name: "Glute Bridges", reps: "2 sets, 15 reps" },
            { phase: "Bodyweight Stamina (x3 Rounds)", name: "Jumping Jacks", reps: "60 seconds" },
            { phase: "Bodyweight Stamina (x3 Rounds)", name: "Bodyweight Squats", reps: "60 seconds" },
            { phase: "Bodyweight Stamina (x3 Rounds)", name: "Plank Hold", reps: "60 seconds" }
        ];

        const eveningRoutines = {
            1: [
                { phase: "Lower Body Stability", name: "Warm-Up (Incline Walk)", reps: "10 mins" },
                { phase: "Lower Body Stability", name: "Goblet Box Squats", reps: "3 sets, 15 reps" },
                { phase: "Lower Body Stability", name: "Bodyweight Reverse Lunges", reps: "3 sets, 12/leg" },
                { phase: "Lower Body Stability", name: "Stability Ball Hamstring Curls", reps: "3 sets, 15 reps" },
                { phase: "Lower Body Stability", name: "Light DB Romanian Deadlifts", reps: "3 sets, 15 reps" },
                { phase: "Lower Body Stability", name: "Single-Arm Suitcase Carries", reps: "3 sets, 40s/side" },
                { phase: "Stamina", name: "Row/Stairmaster (Zone 2)", reps: "10 mins" }
            ],
            2: [
                { phase: "Upper Body Posture", name: "Warm-Up (Elliptical)", reps: "10 mins" },
                { phase: "Upper Body Posture", name: "Cable Face Pulls", reps: "3 sets, 20 reps" },
                { phase: "Upper Body Posture", name: "Band Pull-Aparts", reps: "3 sets, 20 reps" },
                { phase: "Upper Body Posture", name: "Bench-Supported DB Rows", reps: "3 sets, 15/arm" },
                { phase: "Upper Body Posture", name: "Light Incline DB Chest Press", reps: "3 sets, 15 reps" },
                { phase: "Upper Body Posture", name: "Scapular Push-ups", reps: "3 sets, 12 reps" },
                { phase: "Upper Body Posture", name: "Farmer's Walks", reps: "3 sets, 60s" },
                { phase: "Stamina", name: "Treadmill/Cycle (Zone 2)", reps: "10 mins" }
            ],
            3: [
                { phase: "Core & HIIT", name: "Warm-Up (Dynamic Stretch)", reps: "10 mins" },
                { phase: "Core & HIIT", name: "TRX / Ring Fall-outs", reps: "3 sets, 10 reps" },
                { phase: "Core & HIIT", name: "Cable Woodchoppers", reps: "3 sets, 12/side" },
                { phase: "Core & HIIT", name: "Stability Ball 'Stir the Pot'", reps: "3 sets, 10 circles/dir" },
                { phase: "Core & HIIT", name: "Hanging Knee Raises", reps: "3 sets, 15 reps" },
                { phase: "Intervals", name: "HIIT (1m ON / 1.5m OFF)", reps: "10 rounds" }
            ],
            6: [
                { phase: "Full Body Circuit (x4-5 Rounds)", name: "Jump Rope Warm-up", reps: "10 mins" },
                { phase: "Full Body Circuit (x4-5 Rounds)", name: "Light Kettlebell Swings", reps: "15 reps" },
                { phase: "Full Body Circuit (x4-5 Rounds)", name: "Incline Push-ups", reps: "12 reps" },
                { phase: "Full Body Circuit (x4-5 Rounds)", name: "Dumbbell Step-Ups", reps: "10/leg" },
                { phase: "Full Body Circuit (x4-5 Rounds)", name: "TRX Bodyweight Rows", reps: "15 reps" },
                { phase: "Full Body Circuit (x4-5 Rounds)", name: "Medicine Ball Slams", reps: "15 reps" },
                { phase: "Cool Down", name: "Static Stretching", reps: "10 mins" }
            ],
            7: [
                { phase: "Active Recovery", name: "Light Outdoor Walk", reps: "20 mins" },
                { phase: "Active Recovery", name: "Hydration & Sleep Focus", reps: "All day" }
            ]
        };
        // Days 4 and 5 mirror 1 and 2
        eveningRoutines[4] = eveningRoutines[1];
        eveningRoutines[5] = eveningRoutines[2];

        let currentSession = 'morning';
        let state = JSON.parse(localStorage.getItem('workout_state')) || {};

        function setSession(session) {
            currentSession = session;
            document.getElementById('tab-morning').className = `tab ${session === 'morning' ? 'active' : ''}`;
            document.getElementById('tab-evening').className = `tab ${session === 'evening' ? 'active' : ''}`;
            renderView();
        }

        function toggleExercise(id) {
            state[id] = !state[id];
            localStorage.setItem('workout_state', JSON.stringify(state));
            renderView();
        }

        function resetProgress() {
            const day = document.getElementById('daySelect').value;
            Object.keys(state).forEach(key => {
                if(key.startsWith(`d${day}_`)) delete state[key];
            });
            localStorage.setItem('workout_state', JSON.stringify(state));
            renderView();
        }

        function renderView() {
            const day = document.getElementById('daySelect').value;
            const listElement = document.getElementById('workoutList');
            listElement.innerHTML = '';

            const exercises = currentSession === 'morning' ? morningRoutine : eveningRoutines[day];
            let currentPhase = '';
            let completedCount = 0;

            exercises.forEach((ex, index) => {
                const id = `d${day}_${currentSession}_${index}`;
                const isCompleted = state[id];
                if (isCompleted) completedCount++;

                if (ex.phase !== currentPhase) {
                    currentPhase = ex.phase;
                    const phaseEl = document.createElement('div');
                    phaseEl.className = 'phase-title';
                    phaseEl.innerText = currentPhase;
                    listElement.appendChild(phaseEl);
                }

                const exEl = document.createElement('div');
                exEl.className = `exercise ${isCompleted ? 'completed' : ''}`;
                exEl.onclick = () => toggleExercise(id);
                exEl.innerHTML = `
                    <div class="checkbox"></div>
                    <div class="details">
                        <span class="name">${ex.name}</span>
                        <span class="reps">${ex.reps}</span>
                    </div>
                `;
                listElement.appendChild(exEl);
            });

            const progress = exercises.length > 0 ? Math.round((completedCount / exercises.length) * 100) : 0;
            document.getElementById('progressFill').style.width = `${progress}%`;
            document.getElementById('progressText').innerText = `${progress}%`;
        }

        renderView();
    </script>
</body>
</html>
