<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AuraFit Pro">
  <meta name="theme-color" content="#09090b">
  
  <title>AuraFit Pro - Advanced Set Analytics</title>

  <!-- PWA Metadata & Manifest -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%2309090b'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='central' text-anchor='middle' font-size='280'%3E⚡%3C/text%3E%3C/svg%3E">
  <link rel="manifest" id="pwa-manifest">

  <style>
    :root {
      --bg: #09090b; --card: #18181b; 
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --accent-solid: #8b5cf6; --text: #f8fafc; --text-muted: #a1a1aa;
      --border: #27272a; --success: #10b981; --warning: #f59e0b; --glass: rgba(24, 24, 27, 0.85); --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 100px; -webkit-font-smoothing: antialiased; }
    
    header { padding: 40px 20px 20px; background: var(--bg); position: sticky; top: 0; z-index: 10; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.5px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin:0; }
    .version-badge { background: var(--accent-solid); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 800; }
    
    .container { padding: 20px; max-width: 500px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 24px -8px rgba(0,0,0,0.5); }
    label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    
    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      width: 100%; background: #000; border: 1px solid var(--border); border-radius: 12px; color: var(--text); padding: 12px 14px; font-size: 0.95rem; margin-bottom: 12px; outline: none; appearance: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-solid); }
    select { background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a1a1aa%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 16px top 50%; background-size: 10px auto; }
    
    .checkbox-row { display: flex; align-items: center; gap: 12px; margin: 12px 0; cursor: pointer; }
    .checkbox-row input { width: 22px; height: 22px; accent-color: var(--success); }
    
    button.btn-primary { width: 100%; background: var(--accent-gradient); color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 1.05rem; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
    button.btn-secondary { width: 100%; background: #27272a; color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
    button.btn-action { background: #27272a; color: var(--accent-solid); border: 1px solid var(--accent-solid); border-radius: 8px; padding: 6px 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    button.btn-danger { width: 100%; background: transparent; color: var(--danger); border: 1px solid var(--danger); border-radius: 12px; padding: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: var(--glass); backdrop-filter: blur(16px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; padding-top: 12px; padding-bottom: env(safe-area-inset-bottom); z-index: 50; }
    .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
    .nav-btn span.icon { font-size: 1.5rem; filter: grayscale(100%) opacity(0.6); }
    .nav-btn.active { color: var(--text); }
    .nav-btn.active span.icon { filter: grayscale(0%) opacity(1); }
    
    /* Exercise & Set Table Styles */
    .exercise-item { background: #000; padding: 16px; border-radius: 14px; border: 1px solid var(--border); margin-bottom: 16px; }
    .ex-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .ex-name { font-weight: 700; font-size: 1rem; color: var(--text); }
    .ex-prev { font-size: 0.78rem; color: var(--success); margin-bottom: 12px; font-weight: 500; }
    
    .set-table-header { display: grid; grid-template-columns: 45px 1fr 1fr 1fr 32px; gap: 6px; text-align: center; margin-bottom: 6px; }
    .set-table-header span { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    
    .set-row { display: grid; grid-template-columns: 45px 1fr 1fr 1fr 32px; gap: 6px; align-items: center; margin-bottom: 8px; }
    .set-row input { margin-bottom: 0; padding: 8px 4px; text-align: center; font-weight: 600; font-size: 0.88rem; }
    
    .type-badge { height: 36px; border-radius: 8px; border: 1px solid var(--border); background: #18181b; color: var(--text-muted); font-size: 0.75rem; font-weight: 800; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
    .type-badge.warmup { background: rgba(245, 158, 11, 0.15); color: var(--warning); border-color: var(--warning); }
    .type-badge.working { background: rgba(139, 92, 246, 0.15); color: var(--accent-solid); border-color: var(--accent-solid); }

    .btn-remove-set { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.9rem; text-align: center; }
    .btn-remove-set:hover { color: var(--danger); }
    
    .set-actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-add-set { flex: 1; background: #18181b; border: 1px dashed var(--border); color: var(--text); padding: 8px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
    .btn-add-set:hover { border-color: var(--accent-solid); color: var(--accent-solid); }

    .timer-display { font-size: 2.5rem; font-weight: 800; text-align: center; color: var(--accent-solid); margin-bottom: 12px; }
    .timer-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 8px; }
    .btn-timer { background: transparent; color: var(--text); border: 1px solid var(--accent-solid); border-radius: 8px; padding: 8px 16px; font-weight: 600; cursor: pointer; flex: 1; }

    /* Heatmap Grid */
    .heatmap-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin-top: 12px; }
    .heatmap-day { aspect-ratio: 1; border-radius: 4px; background: #27272a; position: relative; }
    .heatmap-day.active { background: var(--success); box-shadow: 0 0 8px rgba(16,185,129,0.4); }

    #chartCanvas { width: 100%; height: 180px; background: #000; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; }
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #27272a; color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 0.9rem; font-weight: 600; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 100; transition: transform 0.3s ease-out; opacity: 0; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    .history-item { border-left: 4px solid var(--accent-solid); padding-left: 16px; margin-bottom: 16px; position: relative; }
    .delete-btn { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>

  <header>
    <h1 id="view-title">AuraFit Analytics</h1>
    <div class="version-badge">v9.0 Pro</div>
  </header>

  <div class="container">
    <!-- WORKOUT TAB -->
    <div id="tab-workout" class="tab-content active">
      <div class="card">
        <label>Date</label>
        <input type="date" id="workout-date">

        <label>Session Type</label>
        <select id="workout-split" onchange="renderExercises()">
          <option value="Morning Day A">Morning Day A (Upper Posture)</option>
          <option value="Morning Day B">Morning Day B (Lower Mobility/Core)</option>
          <option value="Gym Day A">Gym Day A (Upper Posture/Core)</option>
          <option value="Gym Day B">Gym Day B (Legs/Arms)</option>
          <option value="Recovery">Active Recovery / Rest</option>
        </select>
      </div>

      <div class="card" id="routine-container">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <label style="margin:0;">Per-Set Execution</label>
          <button class="btn-action" onclick="quickFillPrevious()">⚡ Auto-Fill Last Logs</button>
        </div>
        <div id="exercise-list"></div>
        <button class="btn-secondary" style="margin-top: 8px;" onclick="addCustomExercise()">+ Add Custom Exercise</button>
      </div>

      <!-- Rest Timer -->
      <div class="card">
        <label style="text-align: center;">Rest Timer</label>
        <div class="timer-display" id="timer-display">00:00</div>
        <div class="timer-buttons">
          <button class="btn-timer" onclick="startTimer(60)">60s</button>
          <button class="btn-timer" onclick="startTimer(90)">90s</button>
          <button class="btn-timer" onclick="startTimer(120)">120s</button>
        </div>
      </div>

      <div class="card">
        <label>Recovery Tracking</label>
        <div class="checkbox-row">
          <input type="checkbox" id="workout-swim">
          <span style="font-weight: 600; font-size: 0.95rem;">Completed 30-min Recovery Swim</span>
        </div>
      </div>
      
      <button class="btn-primary" onclick="saveWorkout()">Save Workout</button>
    </div>

    <!-- JOURNAL TAB -->
    <div id="tab-journal" class="tab-content">
      <div class="card">
        <label>Date</label>
        <input type="date" id="journal-date">

        <label>Directives & Recovery</label>
        <div class="checkbox-row">
          <input type="checkbox" id="habit-sleep">
          <span style="font-weight: 500;">Maintained 10 PM - 6 AM Sleep</span>
        </div>
        <div class="checkbox-row" style="margin-bottom: 24px;">
          <input type="checkbox" id="habit-food">
          <span style="font-weight: 500;">Fresh breakfast with whole eggs</span>
        </div>

        <label id="energy-label">Energy Level: 7/10</label>
        <input type="range" id="journal-energy" min="1" max="10" value="7" oninput="updateEnergy(this.value)">

        <label>Reflection & Posture Notes</label>
        <textarea id="journal-notes" rows="6" placeholder="Notes on posture, core tension, stamina, fatigue, RPE..."></textarea>
      </div>
      <button class="btn-primary" onclick="saveJournal()">Save Journal Entry</button>
    </div>

    <!-- ANALYTICS & HISTORY TAB -->
    <div id="tab-history" class="tab-content">
      <!-- 30-Day Activity Heatmap -->
      <div class="card">
        <label>30-Day Activity Heatmap</label>
        <div class="heatmap-grid" id="heatmap-container"></div>
      </div>

      <!-- Advanced Progress Chart -->
      <div class="card">
        <label>Progress Visualizer</label>
        <select id="chart-exercise" onchange="updateChart()" style="margin-bottom: 8px;">
          <option value="Plamax Machine Chest Press">Plamax Machine Chest Press</option>
          <option value="Plamax Seated Leg Press">Plamax Seated Leg Press</option>
          <option value="Dumbbell RDLs">Dumbbell RDLs</option>
          <option value="Hyperextension Bench">Hyperextension Bench</option>
          <option value="Lat Pulldown Machine">Lat Pulldown Machine</option>
        </select>
        
        <label>Metric Selection</label>
        <select id="chart-metric" onchange="updateChart()" style="margin-bottom: 12px;">
          <option value="e1rm">Max Working e1RM (Excludes Warm-ups)</option>
          <option value="weight">Peak Working Weight</option>
          <option value="volume">Total Working Volume Load</option>
        </select>

        <canvas id="chartCanvas" width="400" height="180"></canvas>
      </div>

      <div id="history-container"></div>

      <!-- Data Export Options -->
      <button class="btn-secondary" onclick="exportCSV()">Export Per-Set CSV (Spreadsheets)</button>
      <button class="btn-secondary" onclick="exportJSON()">Export Backup (JSON)</button>
      <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importData(event)">
      <button class="btn-secondary" onclick="document.getElementById('import-file').click()">Import Backup (JSON)</button>
      <button class="btn-danger" onclick="emergencyReset()">Emergency App Reset</button>
    </div>
  </div>

  <nav class="nav-bar">
    <button class="nav-btn active" id="btn-workout" onclick="switchTab('workout')"><span class="icon">🏋️</span>Workout</button>
    <button class="nav-btn" id="btn-journal" onclick="switchTab('journal')"><span class="icon">📖</span>Journal</button>
    <button class="nav-btn" id="btn-history" onclick="switchTab('history')"><span class="icon">📊</span>Analytics</button>
  </nav>

  <div id="toast" class="toast">Action completed</div>

  <script>
    /* --- APPLICATION STATE & ROUTINES --- */
    function showToast(msg) {
      var t = document.getElementById('toast'); t.innerText = msg;
      t.classList.add('show'); setTimeout(function() { t.classList.remove('show'); }, 2500);
    }

    function getSafeLogs() {
      try { return JSON.parse(localStorage.getItem('logs')) || []; } catch (e) { return []; }
    }

    var routines = {
      "Morning Day A": ["Thoracic Spine Foam Rolling (Release)", "Cat-Cow Stretches (Mobility)", "Wall Angels (Mobility)", "Banded Pull-Aparts (Activation)", "Banded Face Pulls (Activation)"],
      "Morning Day B": ["IT Band & Quad Foam Rolling (Release)", "90/90 Hip Stretches (Mobility)", "Glute Bridges (Mobility)", "Banded Squats (Activation)", "Forearm Plank (Activation)"],
      "Gym Day A": ["Lat Pulldown Machine (Upper back width)", "Cable Crossover / Low Row (Posture)", "Plamax Machine Chest Press (Slow stretch)", "Hyperextension Bench (Lower back endurance)", "Incline Treadmill Walk (Leg/lung stamina)"],
      "Gym Day B": ["Plamax Seated Leg Press (Foundational strength)", "Dumbbell RDLs (Hamstring stretch)", "Plamax Leg Curls (Knee stability)", "Dumbbell Hammer Curls (Grip strength)", "Elliptical Machine (Flush lactic acid)"],
      "Recovery": []
    };

    // Global in-memory representation of sets being logged right now
    // Format: { exIndex: [ { type: 'working'|'warmup', weight: '100', reps: '10', rpe: '8' } ] }
    var exerciseSetsState = {};
    var currentExercisesList = [];
    var timerInterval;

    function updateEnergy(val) { document.getElementById('energy-label').innerText = 'Energy Level: ' + val + '/10'; }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.remove('active'); });
      document.querySelectorAll('.nav-btn').forEach(function(el) { el.classList.remove('active'); });
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('btn-' + tab).classList.add('active');
      
      var titles = { workout: 'Log Workout', journal: 'Daily Journal', history: 'Analytics & History' };
      document.getElementById('view-title').innerText = titles[tab];

      if (tab === 'history') { renderHeatmap(); loadHistory(); updateChart(); }
      window.scrollTo(0, 0);
    }

    function getLastWorkoutData(split) {
      var logs = getSafeLogs();
      for (var p = 0; p < logs.length; p++) {
        if (logs[p] && logs[p].type === 'workout' && logs[p].split === split) return logs[p];
      }
      return null;
    }

    function renderExercises() {
      var split = document.getElementById('workout-split').value;
      var container = document.getElementById('exercise-list');
      var routineCard = document.getElementById('routine-container');
      
      currentExercisesList = routines[split] ? [...routines[split]] : [];
      if (split === 'Recovery') { routineCard.style.display = 'none'; return; }
      routineCard.style.display = 'block';

      var lastWorkout = getLastWorkoutData(split);
      exerciseSetsState = {}; // Reset active state

      var html = '';
      for (var i = 0; i < currentExercisesList.length; i++) {
        var ex = currentExercisesList[i];
        
        // Initialize with 1 Warmup + 2 Working sets by default if no state exists
        exerciseSetsState[i] = [
          { type: 'warmup', weight: '', reps: '', rpe: '' },
          { type: 'working', weight: '', reps: '', rpe: '' },
          { type: 'working', weight: '', reps: '', rpe: '' }
        ];

        // Format previous workout preview text
        var prevText = "No previous logs.";
        if (lastWorkout && lastWorkout.exercises) {
          for (var k = 0; k < lastWorkout.exercises.length; k++) {
            if (lastWorkout.exercises[k] && lastWorkout.exercises[k].name === ex) {
              var setsArr = lastWorkout.exercises[k].sets || [];
              if (setsArr.length > 0) {
                var prevSetStrings = setsArr.map(s => (s.type === 'warmup' ? '[W]' : '[Wk]') + ' ' + (s.weight||'BW') + 'x' + (s.reps||'0'));
                prevText = 'Last: ' + prevSetStrings.join(' | ');
              }
              break;
            }
          }
        }

        html += '<div class="exercise-item" id="ex-card-' + i + '">' +
                  '<div class="ex-header"><div class="ex-name">' + ex + '</div></div>' +
                  '<div class="ex-prev">' + prevText + '</div>' +
                  '<div class="set-table-header">' +
                    '<span>Type</span><span>Weight</span><span>Reps</span><span>RPE</span><span></span>' +
                  '</div>' +
                  '<div id="sets-container-' + i + '"></div>' +
                  '<div class="set-actions">' +
                    '<button class="btn-add-set" onclick="addSetRow(' + i + ', \'working\')">+ Working Set</button>' +
                    '<button class="btn-add-set" onclick="addSetRow(' + i + ', \'warmup\')">+ Warm-up Set</button>' +
                  '</div>' +
                '</div>';
      }

      container.innerHTML = html;
      
      // Render inner set rows
      for (var j = 0; j < currentExercisesList.length; j++) {
        renderSetRowsForExercise(j);
      }
    }

    function renderSetRowsForExercise(exIndex) {
      var container = document.getElementById('sets-container-' + exIndex);
      if (!container) return;
      var sets = exerciseSetsState[exIndex] || [];
      
      var html = '';
      for (var s = 0; s < sets.length; s++) {
        var setObj = sets[s];
        var isWk = setObj.type === 'working';
        
        html += '<div class="set-row">' +
                  '<div class="type-badge ' + setObj.type + '" onclick="toggleSetType(' + exIndex + ',' + s + ')">' + (isWk ? 'Wk' : 'W') + '</div>' +
                  '<input type="text" placeholder="lbs/kg" value="' + (setObj.weight||'') + '" oninput="updateSetState(' + exIndex + ',' + s + ',\'weight\',this.value)">' +
                  '<input type="text" placeholder="reps" value="' + (setObj.reps||'') + '" oninput="updateSetState(' + exIndex + ',' + s + ',\'reps\',this.value)">' +
                  '<input type="number" placeholder="1-10" min="1" max="10" value="' + (setObj.rpe||'') + '" oninput="updateSetState(' + exIndex + ',' + s + ',\'rpe\',this.value)" onchange="autoStartTimerOnInput()">' +
                  '<button class="btn-remove-set" onclick="removeSetRow(' + exIndex + ',' + s + ')">✕</button>' +
                '</div>';
      }
      container.innerHTML = html;
    }

    function updateSetState(exIndex, setIndex, field, value) {
      if (exerciseSetsState[exIndex] && exerciseSetsState[exIndex][setIndex]) {
        exerciseSetsState[exIndex][setIndex][field] = value;
      }
    }

    function toggleSetType(exIndex, setIndex) {
      if (exerciseSetsState[exIndex] && exerciseSetsState[exIndex][setIndex]) {
        var current = exerciseSetsState[exIndex][setIndex].type;
        exerciseSetsState[exIndex][setIndex].type = (current === 'working' ? 'warmup' : 'working');
        renderSetRowsForExercise(exIndex);
      }
    }

    function addSetRow(exIndex, type) {
      if (!exerciseSetsState[exIndex]) exerciseSetsState[exIndex] = [];
      // Grab weight from previous set to speed up logging
      var prevSet = exerciseSetsState[exIndex][exerciseSetsState[exIndex].length - 1];
      var defaultWeight = prevSet ? prevSet.weight : '';
      
      exerciseSetsState[exIndex].push({ type: type, weight: defaultWeight, reps: '', rpe: '' });
      renderSetRowsForExercise(exIndex);
    }

    function removeSetRow(exIndex, setIndex) {
      if (exerciseSetsState[exIndex]) {
        exerciseSetsState[exIndex].splice(setIndex, 1);
        renderSetRowsForExercise(exIndex);
      }
    }

    function quickFillPrevious() {
      var split = document.getElementById('workout-split').value;
      var lastWorkout = getLastWorkoutData(split);
      if (!lastWorkout || !lastWorkout.exercises) { showToast("No previous workout found to fill."); return; }

      for (var i = 0; i < currentExercisesList.length; i++) {
        var ex = currentExercisesList[i];
        for (var k = 0; k < lastWorkout.exercises.length; k++) {
          if (lastWorkout.exercises[k] && lastWorkout.exercises[k].name === ex) {
            var prevSets = lastWorkout.exercises[k].sets || [];
            if (prevSets.length > 0) {
              // Deep clone sets array
              exerciseSetsState[i] = JSON.parse(JSON.stringify(prevSets));
              renderSetRowsForExercise(i);
            }
          }
        }
      }
      showToast("Pre-filled sets from last session!");
    }

    function autoStartTimerOnInput() {
      startTimer(60);
    }

    function addCustomExercise() {
      var name = prompt("Enter custom exercise name:");
      if (!name || !name.trim()) return;
      currentExercisesList.push(name.trim());
      renderExercises();
    }

    /* --- FORMULAS: e1RM & VOLUME --- */
    function calculateE1RM(weight, reps) {
      var w = parseFloat(weight); var r = parseFloat(reps);
      if (isNaN(w) || isNaN(r) || r <= 0) return 0;
      if (r === 1) return w;
      return Math.round(w * (1 + r / 30));
    }

    function saveWorkout() {
      var split = document.getElementById('workout-split').value;
      var exerciseData = [];
      
      if (split !== 'Recovery') {
        for (var i = 0; i < currentExercisesList.length; i++) {
          var sets = exerciseSetsState[i] || [];
          var validSets = sets.filter(s => s.weight || s.reps);

          if (validSets.length > 0) {
            // Compute Max Working e1RM & Volumes
            var maxWorkingE1RM = 0;
            var workingVolume = 0;
            var totalVolume = 0;

            validSets.forEach(function(s) {
              var w = parseFloat(s.weight) || 0;
              var r = parseFloat(s.reps) || 0;
              var vol = w * r;
              totalVolume += vol;

              if (s.type === 'working') {
                workingVolume += vol;
                var setE1RM = calculateE1RM(w, r);
                if (setE1RM > maxWorkingE1RM) maxWorkingE1RM = setE1RM;
              }
            });

            exerciseData.push({
              name: currentExercisesList[i],
              sets: validSets,
              maxE1RM: maxWorkingE1RM,
              workingVolume: workingVolume,
              totalVolume: totalVolume
            });
          }
        }
      }

      var entry = {
        id: new Date().getTime(), type: 'workout', date: document.getElementById('workout-date').value,
        split: split, exercises: exerciseData, swim: document.getElementById('workout-swim').checked
      };

      var logs = getSafeLogs(); logs.unshift(entry);
      localStorage.setItem('logs', JSON.stringify(logs));
      renderExercises();
      document.getElementById('workout-swim').checked = false;
      showToast('Workout saved successfully!');
    }

    function saveJournal() {
      var entry = {
        id: new Date().getTime(), type: 'journal', date: document.getElementById('journal-date').value,
        energy: document.getElementById('journal-energy').value, notes: document.getElementById('journal-notes').value,
        sleep: document.getElementById('habit-sleep').checked, food: document.getElementById('habit-food').checked
      };
      var logs = getSafeLogs(); logs.unshift(entry);
      localStorage.setItem('logs', JSON.stringify(logs));
      document.getElementById('journal-notes').value = '';
      showToast('Journal entry saved successfully!');
    }

    /* --- REST TIMER --- */
    function startTimer(seconds) {
      clearInterval(timerInterval);
      var timeLeft = seconds; updateTimerDisplay(timeLeft);
      timerInterval = setInterval(function() {
        timeLeft--; updateTimerDisplay(timeLeft);
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          showToast("Rest time complete!");
        }
      }, 1000);
    }

    function updateTimerDisplay(s) {
      var m = Math.floor(s / 60); var rem = s % 60;
      document.getElementById('timer-display').innerText = (m < 10 ? '0' + m : m) + ':' + (rem < 10 ? '0' + rem : rem);
    }

    /* --- HEATMAP GENERATOR --- */
    function renderHeatmap() {
      var container = document.getElementById('heatmap-container');
      container.innerHTML = '';
      var logs = getSafeLogs();
      var activeDates = new Set(logs.map(l => l.date));

      var today = new Date();
      for (var i = 29; i >= 0; i--) {
        var d = new Date(); d.setDate(today.getDate() - i);
        var dateStr = d.toISOString().substring(0, 10);
        var div = document.createElement('div');
        div.className = 'heatmap-day' + (activeDates.has(dateStr) ? ' active' : '');
        div.title = dateStr;
        container.appendChild(div);
      }
    }

    /* --- ANALYTICS CANVAS CHART --- */
    function updateChart() {
      var exName = document.getElementById('chart-exercise').value;
      var metric = document.getElementById('chart-metric').value;
      var logs = getSafeLogs();
      var dataPoints = [];

      for (var i = logs.length - 1; i >= 0; i--) {
        if (logs[i] && logs[i].type === 'workout' && logs[i].exercises) {
          for (var j = 0; j < logs[i].exercises.length; j++) {
            var ex = logs[i].exercises[j];
            if (ex && ex.name && ex.name.indexOf(exName) !== -1) {
              var val = 0;
              var sets = ex.sets || [];

              if (metric === 'weight') {
                // Peak weight in working sets
                sets.filter(s => s.type === 'working').forEach(s => {
                  var w = parseFloat(s.weight) || 0;
                  if (w > val) val = w;
                });
              } else if (metric === 'e1rm') {
                val = ex.maxE1RM || 0;
              } else if (metric === 'volume') {
                val = ex.workingVolume || 0;
              }

              if (val > 0) {
                dataPoints.push({ date: (logs[i].date||'').substring(5), val: val });
              }
              break;
            }
          }
        }
      }

      var canvas = document.getElementById('chartCanvas');
      var ctx = canvas.getContext('2d');
      var w = canvas.width; var h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      if (dataPoints.length === 0) {
        ctx.fillStyle = '#a1a1aa'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('No working data logged for this movement/metric.', w / 2, h / 2);
        return;
      }

      var minVal = Math.min(...dataPoints.map(d => d.val)) * 0.85;
      var maxVal = Math.max(...dataPoints.map(d => d.val)) * 1.15;
      if (minVal === maxVal) { minVal -= 5; maxVal += 5; }

      var padLeft = 45; var padRight = 20; var padTop = 30; var padBottom = 30;
      var graphW = w - padLeft - padRight; var graphH = h - padTop - padBottom;

      ctx.strokeStyle = '#27272a'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(padLeft, padTop); ctx.lineTo(w - padRight, padTop); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(padLeft, h - padBottom); ctx.lineTo(w - padRight, h - padBottom); ctx.stroke();

      ctx.strokeStyle = '#8b5cf6'; ctx.lineWidth = 3;
      ctx.beginPath();
      for (var k = 0; k < dataPoints.length; k++) {
        var x = padLeft + (dataPoints.length === 1 ? graphW / 2 : (k / (dataPoints.length - 1)) * graphW);
        var y = h - padBottom - ((dataPoints[k].val - minVal) / (maxVal - minVal)) * graphH;
        if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      for (var m = 0; m < dataPoints.length; m++) {
        var px = padLeft + (dataPoints.length === 1 ? graphW / 2 : (m / (dataPoints.length - 1)) * graphW);
        var py = h - padBottom - ((dataPoints[m].val - minVal) / (maxVal - minVal)) * graphH;

        ctx.fillStyle = '#a855f7'; ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f8fafc'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(dataPoints[m].val, px, py - 10);
        ctx.fillStyle = '#a1a1aa';
        ctx.fillText(dataPoints[m].date, px, h - 10);
      }
    }

    function deleteEntry(id) {
      if (confirm("Delete this log entry?")) {
        var logs = getSafeLogs().filter(function(item) { return item.id !== id; });
        localStorage.setItem('logs', JSON.stringify(logs));
        renderHeatmap(); loadHistory(); updateChart();
        showToast("Entry deleted.");
      }
    }

    function loadHistory() {
      var container = document.getElementById('history-container');
      var logs = getSafeLogs();
      if (logs.length === 0) { container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">No logs available.</p>'; return; }

      var fullHtml = '';
      for (var i = 0; i < logs.length; i++) {
        var item = logs[i]; if (!item) continue;
        if (item.type === 'workout') {
          var exHtml = '';
          if (item.exercises) {
            for (var j = 0; j < item.exercises.length; j++) {
              var e = item.exercises[j];
              if (e && e.name) {
                var setsArr = e.sets || [];
                var setsStr = setsArr.map(s => (s.type === 'warmup' ? '<span style="color:var(--warning)">[W]</span>' : '<span style="color:var(--accent-solid)">[Wk]</span>') + ' ' + (s.weight||'BW') + 'x' + (s.reps||'0') + (s.rpe ? '@' + s.rpe : '')).join(', ');
                
                exHtml += '<div style="margin-bottom:6px;">• <strong style="color:var(--text)">' + e.name.split('(')[0].trim() + ':</strong> ' + setsStr + (e.maxE1RM ? ' <span style="color:var(--success); font-size:0.75rem;">(Max e1RM: ' + e.maxE1RM + ')</span>' : '') + '</div>';
              }
            }
          }
          fullHtml += '<div class="card history-item"><button class="delete-btn" onclick="deleteEntry(' + item.id + ')">✕</button><div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">' + (item.date||'') + ' • WORKOUT</div><strong style="color:var(--accent-solid); display:block; margin: 8px 0; font-size:1.1rem;">' + (item.split||'') + '</strong><div style="font-size:0.88rem; line-height: 1.5;">' + (exHtml || 'No exercises logged') + '</div>' + (item.swim ? '<div style="margin-top:8px; font-size:0.85rem; color:var(--success);">✓ 30-min Swim</div>' : '') + '</div>';
        } else {
          fullHtml += '<div class="card history-item" style="border-left-color: var(--success);"><button class="delete-btn" onclick="deleteEntry(' + item.id + ')">✕</button><div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">' + (item.date||'') + ' • JOURNAL</div><strong style="display:block; margin: 8px 0; font-size:1.1rem;">Energy: ' + (item.energy||7) + '/10</strong><p style="white-space:pre-wrap; font-size:0.9rem;">' + (item.notes || 'No notes') + '</p></div>';
        }
      }
      container.innerHTML = fullHtml;
    }

    /* --- PER-SET CSV EXPORT --- */
    function exportCSV() {
      var logs = getSafeLogs();
      if (logs.length === 0) { showToast("No logs to export."); return; }

      var csv = "Date,Type,Session Split,Exercise,Set Number,Set Type,Weight,Reps,RPE,Set e1RM,Set Volume Load,Energy,Notes\n";
      logs.forEach(function(l) {
        if (l.type === 'workout') {
          (l.exercises || []).forEach(function(e) {
            (e.sets || []).forEach(function(s, idx) {
              var w = parseFloat(s.weight) || 0;
              var r = parseFloat(s.reps) || 0;
              var setE1RM = s.type === 'working' ? calculateE1RM(w, r) : 0;
              csv += `"${l.date}","Workout","${l.split}","${e.name}","${idx + 1}","${s.type}","${s.weight||''}","${s.reps||''}","${s.rpe||''}","${setE1RM}","${w * r}","",""\n`;
            });
          });
        } else {
          csv += `"${l.date}","Journal","","","","","","","","","","${l.energy||''}","${(l.notes||'').replace(/"/g, '""')}"\n`;
        }
      });

      var blob = new Blob([csv], { type: 'text/csv' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = 'aurafit-perset-data-' + new Date().toISOString().slice(0, 10) + '.csv';
      a.click(); URL.revokeObjectURL(url);
    }

    function exportJSON() {
      var data = localStorage.getItem('logs') || '[]';
      var blob = new Blob([data], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = 'aurafit-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click(); URL.revokeObjectURL(url);
    }

    function importData(event) {
      var file = event.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            localStorage.setItem('logs', JSON.stringify(imported));
            renderHeatmap(); loadHistory(); updateChart();
            showToast("Backup imported successfully!");
          }
        } catch(err) { showToast("Invalid JSON file."); }
      };
      reader.readAsText(file);
    }

    function emergencyReset() {
      if (confirm("Reset all stored workout and journal logs?")) {
        localStorage.removeItem('logs');
        renderExercises(); renderHeatmap(); loadHistory(); updateChart();
        showToast("App reset completed.");
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      var today = new Date().toISOString().substring(0, 10);
      document.getElementById('workout-date').value = today;
      document.getElementById('journal-date').value = today;
      renderExercises();
    });
  </script>
</body>
