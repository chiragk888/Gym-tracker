<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AuraFit Pro">
  <title>AuraFit Pro Workout & Journal</title>
  <style>
    :root {
      --bg: #09090b; --card: #18181b; 
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --accent-solid: #8b5cf6; --text: #f8fafc; --text-muted: #a1a1aa;
      --border: #27272a; --success: #10b981; --glass: rgba(24, 24, 27, 0.85); --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 110px; -webkit-font-smoothing: antialiased; }
    
    header { padding: 30px 20px 15px; background: var(--bg); position: sticky; top: 0; z-index: 10; border-bottom: 1px solid var(--border); }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .version-badge { background: var(--success); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; }
    
    .stats-bar { display: flex; gap: 12px; margin-top: 12px; font-size: 0.75rem; color: var(--text-muted); }
    .stat-badge { background: var(--card); padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); flex: 1; text-align: center; }
    .stat-badge strong { color: var(--accent-solid); font-size: 0.9rem; display: block; }

    .container { padding: 20px; max-width: 500px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 24px -8px rgba(0,0,0,0.5); }
    label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    
    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      width: 100%; background: #000; border: 1px solid var(--border); border-radius: 12px; color: var(--text); padding: 14px 16px; font-size: 1rem; margin-bottom: 16px; outline: none; appearance: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-solid); }
    select { background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a1a1aa%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 16px top 50%; background-size: 10px auto; }
    input[type="range"] { width: 100%; margin: 12px 0 24px; accent-color: var(--accent-solid); }
    
    .checkbox-row { display: flex; align-items: center; gap: 12px; margin: 12px 0; cursor: pointer; }
    .checkbox-row input { width: 22px; height: 22px; accent-color: var(--success); }
    
    button.btn-primary { width: 100%; background: var(--accent-gradient); color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 1.05rem; font-weight: 700; cursor: pointer; margin-bottom: 10px; transition: opacity 0.2s; }
    button.btn-primary:active { opacity: 0.8; }
    button.btn-secondary { width: 100%; background: #27272a; color: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 8px; }
    button.btn-danger { width: 100%; background: transparent; color: var(--danger); border: 1px solid var(--danger); border-radius: 12px; padding: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: var(--glass); backdrop-filter: blur(16px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; padding-top: 12px; padding-bottom: env(safe-area-inset-bottom); z-index: 50; }
    .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
    .nav-btn span.icon { font-size: 1.4rem; filter: grayscale(100%) opacity(0.6); }
    .nav-btn.active { color: var(--text); }
    .nav-btn.active span.icon { filter: grayscale(0%) opacity(1); }
    
    .exercise-item { background: #000; padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; }
    .ex-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; color: var(--text); }
    .ex-prev { font-size: 0.8rem; color: var(--success); margin-bottom: 12px; font-weight: 500; }
    .ex-inputs { display: flex; gap: 8px; }
    .input-group { flex: 1; display: flex; flex-direction: column; }
    .input-group label { font-size: 0.65rem; text-align: center; margin-bottom: 4px; }
    .stepper-wrap { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #000; }
    .stepper-wrap input { border: none !important; margin: 0 !important; text-align: center; padding: 8px 0 !important; font-size: 0.95rem !weight: 600; width: 100%; border-radius: 0 !important; }
    .step-btn { background: #18181b; border: none; color: var(--text-muted); width: 28px; font-weight: bold; cursor: pointer; }
    
    .history-item { border-left: 4px solid var(--accent-solid); padding-left: 16px; margin-bottom: 16px; position: relative; }
    .history-item .del-btn { position: absolute; top: 16px; right: 16px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; }

    .timer-display { font-size: 2.5rem; font-weight: 800; text-align: center; color: var(--accent-solid); margin-bottom: 12px; }
    .timer-buttons { display: flex; gap: 8px; justify-content: center; }
    .btn-timer { background: transparent; color: var(--text); border: 1px solid var(--accent-solid); border-radius: 8px; padding: 8px; font-weight: 600; cursor: pointer; flex: 1; }

    svg.chart-svg { width: 100%; height: 140px; overflow: visible; margin-top: 10px; }
    .chart-axis { stroke: var(--border); stroke-width: 1; }
    .chart-line { fill: none; stroke: var(--accent-solid); stroke-width: 3; stroke-linecap: round; }
    .chart-point { fill: #a855f7; stroke: #fff; stroke-width: 2; }
    .chart-text { fill: var(--text-muted); font-size: 10px; text-anchor: middle; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1 id="view-title">Log Workout</h1>
      <div class="version-badge">v7.0 Pro</div>
    </div>
    <div class="stats-bar">
      <div class="stat-badge"><strong id="stat-workouts">0</strong>Workouts</div>
      <div class="stat-badge"><strong id="stat-journals">0</strong>Journals</div>
      <div class="stat-badge"><strong id="stat-streak">0 Days</strong>Streak</div>
    </div>
  </header>

  <div class="container">
    <!-- WORKOUT TAB -->
    <div id="tab-workout" class="tab-content active">
      <div class="card">
        <label>Date</label>
        <input type="date" id="workout-date">

        <label>Session Type</label>
        <select id="workout-split" onchange="renderExercises()">
          <option value="Morning Day A">Morning Day A (Upper Posture)</option>
          <option value="Morning Day B">Morning Day B (Lower Mobility/Core)</option>
          <option value="Gym Day A">Gym Day A (Upper Posture/Core)</option>
          <option value="Gym Day B">Gym Day B (Legs/Arms)</option>
          <option value="Recovery">Active Recovery / Rest</option>
        </select>
      </div>

      <div class="card" id="routine-container">
        <label>Routine Breakdown</label>
        <div id="exercise-list"></div>
      </div>

      <!-- Rest Timer -->
      <div class="card">
        <label style="text-align: center;">Set Rest Timer</label>
        <div class="timer-display" id="timer-display">00:00</div>
        <div class="timer-buttons">
          <button class="btn-timer" onclick="startTimer(60)">60s</button>
          <button class="btn-timer" onclick="startTimer(90)">90s</button>
          <button class="btn-timer" onclick="startTimer(120)">120s</button>
          <button class="btn-timer" style="border-color: var(--danger);" onclick="stopTimer()">Stop</button>
        </div>
      </div>

      <div class="card">
        <label>Recovery Tracking</label>
        <div class="checkbox-row">
          <input type="checkbox" id="workout-swim">
          <span style="font-weight: 600; font-size: 0.95rem;">Completed 30-min Recovery Swim</span>
        </div>
      </div>
      
      <button class="btn-primary" onclick="saveWorkout()">Save Workout</button>
    </div>

    <!-- JOURNAL TAB -->
    <div id="tab-journal" class="tab-content">
      <div class="card">
        <label>Date</label>
        <input type="date" id="journal-date">

        <label>Morning Directives</label>
        <div class="checkbox-row">
          <input type="checkbox" id="habit-sleep">
          <span style="font-weight: 500;">Maintained 10 PM - 6 AM Sleep</span>
        </div>
        <div class="checkbox-row" style="margin-bottom: 24px;">
          <input type="checkbox" id="habit-food">
          <span style="font-weight: 500;">Fresh breakfast with whole eggs</span>
        </div>

        <label id="energy-label">Energy Level: 7/10</label>
        <input type="range" id="journal-energy" min="1" max="10" value="7" oninput="updateEnergy(this.value)">

        <label>Daily Reflection & Posture Log</label>
        <textarea id="journal-notes" rows="6" placeholder="Notes on posture, core tension, physical stamina..."></textarea>
      </div>
      <button class="btn-primary" onclick="saveJournal()">Save Journal Entry</button>
    </div>

    <!-- HISTORY TAB -->
    <div id="tab-history" class="tab-content">
      <div class="card">
        <label>Progress Visualizer</label>
        <select id="chart-exercise" onchange="updateChart()" style="margin-bottom: 8px;">
          <option value="Plamax Machine Chest Press">Plamax Machine Chest Press</option>
          <option value="Plamax Seated Leg Press">Plamax Seated Leg Press</option>
          <option value="Dumbbell RDLs">Dumbbell RDLs</option>
          <option value="Hyperextension Bench">Hyperextension Bench</option>
          <option value="Lat Pulldown Machine">Lat Pulldown Machine</option>
        </select>
        <div id="progressChart"></div>
      </div>

      <div id="history-container"></div>
      
      <button class="btn-secondary" onclick="exportData()">Export Backup (JSON)</button>
      <button class="btn-secondary" onclick="document.getElementById('import-file').click()">Import Backup (JSON)</button>
      <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importData(event)">
      
      <button class="btn-danger" onclick="emergencyReset()">Emergency App Reset</button>
    </div>
  </div>

  <nav class="nav-bar">
    <button class="nav-btn active" id="btn-workout" onclick="switchTab('workout')"><span class="icon">🏋️</span>Workout</button>
    <button class="nav-btn" id="btn-journal" onclick="switchTab('journal')"><span class="icon">📖</span>Journal</button>
    <button class="nav-btn" id="btn-history" onclick="switchTab('history')"><span class="icon">📊</span>History</button>
  </nav>

  <script>
    function getSafeLogs() {
      try {
        var data = localStorage.getItem('logs');
        return data ? JSON.parse(data) || [] : [];
      } catch (e) { return []; }
    }

    var routines = {
      "Morning Day A": ["Thoracic Spine Foam Rolling (Release)", "Cat-Cow Stretches (Mobility)", "Wall Angels (Mobility)", "Banded Pull-Aparts (Activation)", "Banded Face Pulls (Activation)"],
      "Morning Day B": ["IT Band & Quad Foam Rolling (Release)", "90/90 Hip Stretches (Mobility)", "Glute Bridges (Mobility)", "Banded Squats (Activation)", "Forearm Plank (Activation)"],
      "Gym Day A": ["Lat Pulldown Machine (Upper back width)", "Cable Crossover / Low Row (Posture)", "Plamax Machine Chest Press (Slow stretch)", "Hyperextension Bench (Lower back endurance)", "Incline Treadmill Walk (Leg/lung stamina)"],
      "Gym Day B": ["Plamax Seated Leg Press (Foundational strength)", "Dumbbell RDLs (Hamstring stretch)", "Plamax Leg Curls (Knee stability)", "Dumbbell Hammer Curls (Grip strength)", "Elliptical Machine (Flush lactic acid)"],
      "Recovery": []
    };

    var timerInterval;

    function updateEnergy(val) { document.getElementById('energy-label').innerText = 'Energy Level: ' + val + '/10'; }

    function adjustInput(id, delta) {
      var el = document.getElementById(id);
      if (!el) return;
      var val = parseFloat(el.value) || 0;
      el.value = Math.max(0, val + delta);
    }

    function updateStats() {
      var logs = getSafeLogs();
      var workouts = logs.filter(l => l.type === 'workout').length;
      var journals = logs.filter(l => l.type === 'journal').length;
      
      document.getElementById('stat-workouts').innerText = workouts;
      document.getElementById('stat-journals').innerText = journals;

      // Streak calculation
      var dates = Array.from(new Set(logs.map(l => l.date))).sort().reverse();
      var streak = 0;
      var today = new Date().toISOString().substring(0, 10);
      
      if (dates.length > 0) {
        var curr = new Date(today);
        for (var i = 0; i < dates.length; i++) {
          var d = new Date(dates[i]);
          var diff = Math.floor((curr - d) / (1000 * 60 * 60 * 24));
          if (diff <= 1) { streak++; curr = d; } else break;
        }
      }
      document.getElementById('stat-streak').innerText = streak + ' Days';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('btn-' + tab).classList.add('active');
      
      var titles = { workout: 'Log Workout', journal: 'Daily Journal', history: 'Log & Progress' };
      document.getElementById('view-title').innerText = titles[tab];

      if (tab === 'history') { loadHistory(); updateChart(); }
      window.scrollTo(0, 0);
    }

    function renderExercises() {
      var split = document.getElementById('workout-split').value;
      var container = document.getElementById('exercise-list');
      var routineCard = document.getElementById('routine-container');
      var currentExercises = routines[split];

      if (!currentExercises || currentExercises.length === 0) {
        routineCard.style.display = 'none';
        return;
      }
      routineCard.style.display = 'block';
      
      var logs = getSafeLogs();
      var lastWorkout = logs.find(l => l.type === 'workout' && l.split === split);

      var html = '';
      for (var i = 0; i < currentExercises.length; i++) {
        var ex = currentExercises[i];
        var prevText = "No previous data logged.";
        
        if (lastWorkout && lastWorkout.exercises) {
          var eData = lastWorkout.exercises.find(e => e.name === ex);
          if (eData && (eData.weight || eData.sets || eData.reps)) {
            prevText = 'Last: ' + (eData.weight || '-') + ' kg | ' + (eData.sets || '-') + ' sets | ' + (eData.reps || '-');
          }
        }

        html += `
          <div class="exercise-item">
            <div class="ex-name">${ex}</div>
            <div class="ex-prev">${prevText}</div>
            <div class="ex-inputs">
              <div class="input-group">
                <label>Load (kg)</label>
                <div class="stepper-wrap">
                  <button class="step-btn" onclick="adjustInput('w-${i}', -5)">-</button>
                  <input type="text" id="w-${i}" placeholder="-">
                  <button class="step-btn" onclick="adjustInput('w-${i}', 5)">+</button>
                </div>
              </div>
              <div class="input-group">
                <label>Sets</label>
                <div class="stepper-wrap">
                  <button class="step-btn" onclick="adjustInput('s-${i}', -1)">-</button>
                  <input type="number" id="s-${i}" placeholder="0">
                  <button class="step-btn" onclick="adjustInput('s-${i}', 1)">+</button>
                </div>
              </div>
              <div class="input-group">
                <label>Reps</label>
                <div class="stepper-wrap">
                  <button class="step-btn" onclick="adjustInput('r-${i}', -1)">-</button>
                  <input type="text" id="r-${i}" placeholder="-">
                  <button class="step-btn" onclick="adjustInput('r-${i}', 1)">+</button>
                </div>
              </div>
            </div>
          </div>`;
      }
      container.innerHTML = html;
    }

    function saveWorkout() {
      var split = document.getElementById('workout-split').value;
      var exerciseData = [];
      var currentExercises = routines[split] || [];
      
      if (split !== 'Recovery') {
        for (var i = 0; i < currentExercises.length; i++) {
          var weight = (document.getElementById('w-' + i) || {}).value;
          var sets = (document.getElementById('s-' + i) || {}).value;
          var reps = (document.getElementById('r-' + i) || {}).value;
          if (weight || sets || reps) {
            exerciseData.push({ name: currentExercises[i], weight: weight, sets: sets, reps: reps });
          }
        }
      }

      var entry = {
        id: new Date().getTime(), type: 'workout', date: document.getElementById('workout-date').value,
        split: split, exercises: exerciseData, swim: document.getElementById('workout-swim').checked
      };

      var logs = getSafeLogs();
      logs.unshift(entry);
      localStorage.setItem('logs', JSON.stringify(logs));
      renderExercises();
      updateStats();
      document.getElementById('workout-swim').checked = false;
      alert('Workout saved successfully!');
    }

    function saveJournal() {
      var entry = {
        id: new Date().getTime(), type: 'journal', date: document.getElementById('journal-date').value,
        energy: document.getElementById('journal-energy').value, notes: document.getElementById('journal-notes').value,
        sleep: document.getElementById('habit-sleep').checked, food: document.getElementById('habit-food').checked
      };
      var logs = getSafeLogs();
      logs.unshift(entry);
      localStorage.setItem('logs', JSON.stringify(logs));
      document.getElementById('journal-notes').value = '';
      document.getElementById('habit-sleep').checked = false;
      document.getElementById('habit-food').checked = false;
      updateStats();
      alert('Journal entry saved successfully!');
    }

    function startTimer(seconds) {
      stopTimer();
      var timeLeft = seconds;
      updateTimerDisplay(timeLeft);
      timerInterval = setInterval(function() {
        timeLeft--; updateTimerDisplay(timeLeft);
        if (timeLeft <= 0) { 
          stopTimer(); 
          triggerTimerAlert();
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      updateTimerDisplay(0);
    }

    function triggerTimerAlert() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        osc.type = 'sine'; osc.frequency.value = 880;
        osc.connect(ctx.destination);
        osc.start(); setTimeout(() => osc.stop(), 500);
      } catch (e) {}
      if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
      alert("Rest complete!");
    }

    function updateTimerDisplay(s) {
      var m = Math.floor(s / 60); var rem = s % 60;
      document.getElementById('timer-display').innerText = (m < 10 ? '0' + m : m) + ':' + (rem < 10 ? '0' + rem : rem);
    }

    function updateChart() {
      var exName = document.getElementById('chart-exercise').value;
      var logs = getSafeLogs();
      var dataPoints = [];

      logs.forEach(l => {
        if (l.type === 'workout' && l.exercises) {
          var match = l.exercises.find(e => e.name && e.name.indexOf(exName) !== -1 && !isNaN(parseFloat(e.weight)));
          if (match) dataPoints.push({ date: (l.date||'').substring(5), weight: parseFloat(match.weight) });
        }
      });

      dataPoints = dataPoints.slice(0, 6).reverse();

      if (dataPoints.length < 2) {
        document.getElementById('progressChart').innerHTML = '<div style="text-align:center; color:var(--text-muted); padding: 20px 0;">Log at least 2 sessions with numeric weights to view chart.</div>';
        return;
      }

      var weights = dataPoints.map(d => d.weight);
      var minW = Math.min(...weights) - 5;
      var maxW = Math.max(...weights) + 5;
      
      var pointsSVG = dataPoints.map((d, idx) => {
        var x = 30 + (idx * (240 / (dataPoints.length - 1)));
        var y = 110 - (((d.weight - minW) / (maxW - minW)) * 80);
        return { x: x, y: y, weight: d.weight, date: d.date };
      });

      var polylineCoords = pointsSVG.map(p => `${p.x},${p.y}`).join(' ');

      var svgHtml = `<svg class="chart-svg" viewBox="0 0 300 140">
        <line x1="20" y1="110" x2="280" y2="110" class="chart-axis"/>
        <polyline points="${polylineCoords}" class="chart-line"/>
        ${pointsSVG.map(p => `
          <circle cx="${p.x}" cy="${p.y}" r="4" class="chart-point"/>
          <text x="${p.x}" y="${p.y - 10}" class="chart-text">${p.weight}kg</text>
          <text x="${p.x}" y="125" class="chart-text">${p.date}</text>
        `).join('')}
      </svg>`;

      document.getElementById('progressChart').innerHTML = svgHtml;
    }

    function deleteEntry(id) {
      if (!confirm("Delete this log entry?")) return;
      var logs = getSafeLogs().filter(item => item.id !== id);
      localStorage.setItem('logs', JSON.stringify(logs));
      loadHistory(); updateChart(); updateStats();
    }

    function loadHistory() {
      var container = document.getElementById('history-container');
      var logs = getSafeLogs();
      if (logs.length === 0) { container.innerHTML = '<p style="text-align:center; color:var(--text-muted);">No entries saved yet.</p>'; return; }

      var fullHtml = '';
      logs.forEach(item => {
        if (!item) return;
        var deleteBtn = `<button class="del-btn" onclick="deleteEntry(${item.id})">✕</button>`;
        if (item.type === 'workout') {
          var exHtml = '';
          if (item.exercises) {
            item.exercises.forEach(e => {
              if (e && e.name) exHtml += `<div>• <span style="color:var(--text-muted)">${e.name.split('(')[0].trim()}:</span> <strong>${e.weight || 'BW'}</strong> (${e.sets||'-'}x${e.reps||'-'})</div>`;
            });
          }
          fullHtml += `<div class="card history-item">${deleteBtn}<div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">${item.date||''} • WORKOUT</div><strong style="color:var(--accent-solid); display:block; margin: 6px 0; font-size:1.05rem;">${item.split||''}</strong><div style="font-size:0.9rem; line-height: 1.5;">${exHtml || 'No exercises logged'}</div>${item.swim ? '<div style="margin-top:10px; font-size:0.8rem; color:var(--success);">✓ 30-min Swim Logged</div>' : ''}</div>`;
        } else {
          fullHtml += `<div class="card history-item" style="border-left-color: var(--success);">${deleteBtn}<div style="font-size:0.75rem; color:var(--text-muted); font-weight:700;">${item.date||''} • JOURNAL</div><strong style="display:block; margin: 6px 0; font-size:1.05rem;">Energy: ${item.energy||7}/10</strong><div style="margin-bottom: 8px;">${item.sleep ? '<span style="font-size:0.75rem; background:rgba(16,185,129,0.2); color:#10b981; padding: 2px 6px; border-radius: 4px; margin-right: 6px;">🌙 Sleep</span>' : ''}${item.food ? '<span style="font-size:0.75rem; background:rgba(16,185,129,0.2); color:#10b981; padding: 2px 6px; border-radius: 4px;">🍳 Breakfast</span>' : ''}</div><p style="white-space:pre-wrap; font-size:0.9rem;">${item.notes || 'No notes'}</p></div>`;
        }
      });
      container.innerHTML = fullHtml;
    }

    function exportData() {
      var data = localStorage.getItem('logs') || '[]';
      var blob = new Blob([data], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'aurafit-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(event) {
      var file = event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var importedLogs = JSON.parse(e.target.result);
          if (Array.isArray(importedLogs)) {
            localStorage.setItem('logs', JSON.stringify(importedLogs));
            loadHistory(); updateChart(); renderExercises(); updateStats();
            alert("Data imported successfully!");
          } else alert("Invalid file format.");
        } catch (err) { alert("Error reading JSON file."); }
      };
      reader.readAsText(file);
    }

    function emergencyReset() {
      if (confirm("Are you sure you want to delete all saved workout and journal logs? This cannot be undone.")) {
        localStorage.removeItem('logs');
        renderExercises(); loadHistory(); updateChart(); updateStats();
        alert("App data reset successfully.");
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      var today = new Date().toISOString().substring(0, 10);
      document.getElementById('workout-date').value = today;
      document.getElementById('journal-date').value = today;
      renderExercises();
      updateStats();
    });
  </script>
</body>
</html>
