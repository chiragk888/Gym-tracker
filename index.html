<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AuraFit">
  <title>Premium Workout & Journal</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <style>
    :root {
      --bg: #09090b; 
      --card: #18181b; 
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --accent-solid: #8b5cf6;
      --text: #f8fafc;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --success: #10b981;
      --glass: rgba(24, 24, 27, 0.85);
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 100px; -webkit-font-smoothing: antialiased; }
    
    header { padding: 40px 20px 20px; background: var(--bg); position: sticky; top: 0; z-index: 10; }
    h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.5px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .container { padding: 0 20px; max-width: 500px; margin: 0 auto; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .tab-content { display: none; animation: fadeIn 0.3s ease-out forwards; }
    .tab-content.active { display: block; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 24px -8px rgba(0,0,0,0.5); }
    label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    
    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      width: 100%; background: #000; border: 1px solid var(--border); border-radius: 12px; color: var(--text); padding: 14px 16px; font-size: 1rem; margin-bottom: 16px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; appearance: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-solid); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2); }
    
    select { background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23a1a1aa%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 16px top 50%; background-size: 10px auto; }
    input[type="range"] { width: 100%; margin: 12px 0 24px; accent-color: var(--accent-solid); }
    
    .checkbox-row { display: flex; align-items: center; gap: 12px; margin: 12px 0; cursor: pointer; }
    .checkbox-row input { width: 24px; height: 24px; accent-color: var(--success); border-radius: 6px; }
    
    button.btn-primary { width: 100%; background: var(--accent-gradient); color: #fff; border: none; border-radius: 12px; padding: 16px; font-size: 1.05rem; font-weight: 700; cursor: pointer; transition: transform 0.1s; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3); }
    button.btn-primary:active { transform: scale(0.97); }
    
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px; padding-bottom: env(safe-area-inset-bottom); z-index: 50; }
    .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: color 0.2s; }
    .nav-btn span.icon { font-size: 1.5rem; filter: grayscale(100%) opacity(0.6); }
    .nav-btn.active { color: var(--text); }
    .nav-btn.active span.icon { filter: grayscale(0%) opacity(1); }
    
    .exercise-item { background: #000; padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 16px; }
    .ex-name { font-weight: 700; font-size: 1rem; margin-bottom: 4px; color: var(--text); }
    .ex-prev { font-size: 0.8rem; color: var(--success); margin-bottom: 12px; font-weight: 500; }
    .ex-inputs { display: flex; gap: 12px; }
    .ex-inputs input { margin-bottom: 0; padding: 10px; text-align: center; font-weight: 600; font-size: 1.1rem; }
    .ex-inputs .input-group { flex: 1; display: flex; flex-direction: column; }
    .ex-inputs label { font-size: 0.65rem; text-align: center; margin-bottom: 6px; }
    
    .history-item { border-left: 4px solid var(--accent-solid); padding-left: 16px; margin-bottom: 16px; }

    /* Timer Styles */
    .timer-display { font-size: 2.5rem; font-weight: 800; text-align: center; color: var(--accent-solid); margin-bottom: 12px; font-variant-numeric: tabular-nums; }
    .timer-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 8px; }
    .btn-timer { background: transparent; color: var(--text); border: 1px solid var(--accent-solid); border-radius: 8px; padding: 8px 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; flex: 1; }
    .btn-timer:active { background: rgba(139, 92, 246, 0.2); }
  </style>
</head>
<body>

  <header>
    <h1 id="view-title">Log Workout</h1>
  </header>

  <div class="container">
    <!-- WORKOUT TAB -->
    <div id="tab-workout" class="tab-content active">
      <div class="card">
        <label>Date</label>
        <input type="date" id="workout-date">

        <label>Session Type</label>
        <select id="workout-split" onchange="renderExercises()">
          <option value="Morning Day A">Morning Day A (Upper Posture)</option>
          <option value="Morning Day B">Morning Day B (Lower Mobility/Core)</option>
          <option value="Gym Day A">Gym Day A (Upper Posture/Core)</option>
          <option value="Gym Day B">Gym Day B (Legs/Arms)</option>
          <option value="Recovery">Active Recovery / Rest</option>
        </select>
      </div>

      <div class="card" id="routine-container">
        <label>Routine Breakdown</label>
        <div id="exercise-list"></div>
      </div>

      <!-- Rest Timer -->
      <div class="card">
        <label style="text-align: center;">Set Rest Timer</label>
        <div class="timer-display" id="timer-display">00:00</div>
        <div class="timer-buttons">
          <button class="btn-timer" onclick="startTimer(60)">60s</button>
          <button class="btn-timer" onclick="startTimer(90)">90s</button>
          <button class="btn-timer" onclick="startTimer(120)">120s</button>
        </div>
      </div>

      <div class="card">
        <label>Recovery Tracking</label>
        <div class="checkbox-row">
          <input type="checkbox" id="workout-swim">
          <span style="font-weight: 600; font-size: 0.95rem;">Completed 30-min Recovery Swim</span>
        </div>
      </div>
      
      <button class="btn-primary" onclick="saveWorkout()">Save Workout</button>
    </div>

    <!-- JOURNAL TAB -->
    <div id="tab-journal" class="tab-content">
      <div class="card">
        <label>Date</label>
        <input type="date" id="journal-date">

        <!-- Morning Checklist -->
        <label>Morning Directives</label>
        <div class="checkbox-row">
          <input type="checkbox" id="habit-sleep">
          <span style="font-weight: 500;">Maintained 10 PM - 6 AM Sleep Schedule</span>
        </div>
        <div class="checkbox-row" style="margin-bottom: 24px;">
          <input type="checkbox" id="habit-food">
          <span style="font-weight: 500;">Fresh breakfast with whole eggs (No whey)</span>
        </div>

        <label id="energy-label">Energy Level: 7/10</label>
        <input type="range" id="journal-energy" min="1" max="10" value="7" oninput="updateEnergy(this.value)">

        <label>Daily Reflection & Posture Log</label>
        <textarea id="journal-notes" rows="6" placeholder="Notes on posture, core tension, physical stamina, or mental focus..."></textarea>
      </div>
      <button class="btn-primary" onclick="saveJournal()">Save Journal Entry</button>
    </div>

    <!-- HISTORY TAB -->
    <div id="tab-history" class="tab-content">
      <!-- Progress Visualizations -->
      <div class="card">
        <label>Progress Chart (Load vs. Time)</label>
        <select id="chart-exercise" onchange="updateChart()" style="margin-bottom: 20px;">
          <option value="Plamax Machine Chest Press">Plamax Machine Chest Press</option>
          <option value="Plamax Seated Leg Press">Plamax Seated Leg Press</option>
          <option value="Dumbbell RDLs">Dumbbell RDLs</option>
          <option value="Hyperextension Bench">Hyperextension Bench</option>
          <option value="Lat Pulldown Machine">Lat Pulldown Machine</option>
        </select>
        <canvas id="progressChart" height="220"></canvas>
      </div>

      <div id="history-container"></div>
      <button class="btn-primary" style="background:#27272a; box-shadow:none; margin-top: 10px;" onclick="exportData()">Export Data (JSON)</button>
    </div>
  </div>

  <nav class="nav-bar">
    <button class="nav-btn active" id="btn-workout" onclick="switchTab('workout')"><span class="icon">🏋️</span>Workout</button>
    <button class="nav-btn" id="btn-journal" onclick="switchTab('journal')"><span class="icon">📖</span>Journal</button>
    <button class="nav-btn" id="btn-history" onclick="switchTab('history')"><span class="icon">📊</span>History</button>
  </nav>

  <script>
    // DEFENSIVE DESIGN: Safe LocalStorage Getter
    function getSafeLogs() {
      try {
        var data = localStorage.getItem('logs');
        if (!data) return [];
        var parsed = JSON.parse(data);
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        console.error("Cache read error protected.");
        return [];
      }
    }

    var routines = {
      "Morning Day A": ["Thoracic Spine Foam Rolling (Release)", "Cat-Cow Stretches (Mobility)", "Wall Angels (Mobility)", "Banded Pull-Aparts (Activation)", "Banded Face Pulls (Activation)"],
      "Morning Day B": ["IT Band & Quad Foam Rolling (Release)", "90/90 Hip Stretches (Mobility)", "Glute Bridges (Mobility)", "Banded Squats (Activation)", "Forearm Plank (Activation)"],
      "Gym Day A": ["Lat Pulldown Machine (Upper back width)", "Cable Crossover / Low Row (Posture)", "Plamax Machine Chest Press (Slow stretch)", "Hyperextension Bench (Lower back endurance)", "Incline Treadmill Walk (Leg/lung stamina)"],
      "Gym Day B": ["Plamax Seated Leg Press (Foundational strength)", "Dumbbell RDLs (Hamstring stretch)", "Plamax Leg Curls (Knee stability)", "Dumbbell Hammer Curls (Grip strength)", "Elliptical Machine (Flush lactic acid)"],
      "Recovery": []
    };

    var currentSplitExercises = [];
    var timerInterval;
    var progressChart;

    // DEFENSIVE DESIGN: Safe Date Formatting (No modern padStart)
    var d = new Date();
    var mm = ('0' + (d.getMonth() + 1)).slice(-2);
    var dd = ('0' + d.getDate()).slice(-2);
    var today = d.getFullYear() + '-' + mm + '-' + dd;
    
    document.getElementById('workout-date').value = today;
    document.getElementById('journal-date').value = today;

    renderExercises();

    function updateEnergy(val) {
      document.getElementById('energy-label').innerText = 'Energy Level: ' + val + '/10';
    }

    // DEFENSIVE DESIGN: Safe Iteration loops instead of modern NodeList.forEach
    function switchTab(tab) {
      var tabContents = document.querySelectorAll('.tab-content');
      for (var i = 0; i < tabContents.length; i++) {
        tabContents[i].classList.remove('active');
      }
      
      var navBtns = document.querySelectorAll('.nav-btn');
      for (var j = 0; j < navBtns.length; j++) {
        navBtns[j].classList.remove('active');
      }
      
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('btn-' + tab).classList.add('active');
      
      var titles = { workout: 'Log Workout', journal: 'Daily Journal', history: 'Log & Progress' };
      document.getElementById('view-title').innerText = titles[tab];

      if (tab === 'history') {
        loadHistory();
        updateChart();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderExercises() {
      var split = document.getElementById('workout-split').value;
      var container = document.getElementById('exercise-list');
      var routineCard = document.getElementById('routine-container');
      
      currentSplitExercises = routines[split];

      if (!currentSplitExercises || currentSplitExercises.length === 0) {
        routineCard.style.display = 'none';
        return;
      }

      routineCard.style.display = 'block';
      
      // Find last workout safely
      var logs = getSafeLogs();
      var lastWorkout = null;
      for (var p = 0; p < logs.length; p++) {
        if (logs[p].type === 'workout' && logs[p].split === split) {
          lastWorkout = logs[p];
          break;
        }
      }

      var html = '';
      for (var i = 0; i < currentSplitExercises.length; i++) {
        var ex = currentSplitExercises[i];
        var prevText = "No previous data logged.";
        
        if (lastWorkout && lastWorkout.exercises) {
          for (var k = 0; k < lastWorkout.exercises.length; k++) {
            if (lastWorkout.exercises[k].name === ex) {
              var eData = lastWorkout.exercises[k];
              if (eData.weight || eData.sets || eData.reps) {
                prevText = 'Last: ' + (eData.weight || '-') + ' | ' + (eData.sets || '-') + ' sets | ' + (eData.reps || '-');
              }
              break;
            }
          }
        }

        html += '<div class="exercise-item">' +
                  '<div class="ex-name">' + ex + '</div>' +
                  '<div class="ex-prev">' + prevText + '</div>' +
                  '<div class="ex-inputs">' +
                    '<div class="input-group"><label>Load/Band</label><input type="text" id="w-' + i + '" placeholder="-"></div>' +
                    '<div class="input-group"><label>Sets</label><input type="number" id="s-' + i + '" placeholder="0"></div>' +
                    '<div class="input-group"><label>Reps/Time</label><input type="text" id="r-' + i + '" placeholder="-"></div>' +
                  '</div>' +
                '</div>';
      }
      container.innerHTML = html;
    }

    function saveWorkout() {
      var split = document.getElementById('workout-split').value;
      var exerciseData = [];
      
      if (split !== 'Recovery') {
        for (var i = 0; i < currentSplitExercises.length; i++) {
          var weight = document.getElementById('w-' + i).value;
          var sets = document.getElementById('s-' + i).value;
          var reps = document.getElementById('r-' + i).value;
          if (weight || sets || reps) {
            exerciseData.push({ name: currentSplitExercises[i], weight: weight, sets: sets, reps: reps });
          }
        }
      }

      var entry = {
        id: new Date().getTime(), 
        type: 'workout', 
        date: document.getElementById('workout-date').value,
        split: split, 
        exercises: exerciseData, 
        swim: document.getElementById('workout-swim').checked
      };

      try {
        var logs = getSafeLogs();
        logs.unshift(entry);
        localStorage.setItem('logs', JSON.stringify(logs));
      } catch (e) {
        alert("Failed to save. Ensure your browser is not in private mode.");
      }

      renderExercises();
      document.getElementById('workout-swim').checked = false;
      try { if (navigator.vibrate) navigator.vibrate(50); } catch(e){}
      alert('Workout saved successfully!');
    }

    function saveJournal() {
      var entry = {
        id: new Date().getTime(), 
        type: 'journal', 
        date: document.getElementById('journal-date').value,
        energy: document.getElementById('journal-energy').value, 
        notes: document.getElementById('journal-notes').value,
        sleep: document.getElementById('habit-sleep').checked, 
        food: document.getElementById('habit-food').checked
      };

      try {
        var logs = getSafeLogs();
        logs.unshift(entry);
        localStorage.setItem('logs', JSON.stringify(logs));
      } catch (e) {
        alert("Failed to save. Ensure your browser is not in private mode.");
      }

      document.getElementById('journal-notes').value = '';
      document.getElementById('habit-sleep').checked = false;
      document.getElementById('habit-food').checked = false;
      try { if (navigator.vibrate) navigator.vibrate(50); } catch(e){}
      alert('Journal entry saved successfully!');
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      var timeLeft = seconds;
      updateTimerDisplay(timeLeft);
      
      timerInterval = setInterval(function() {
        timeLeft--;
        updateTimerDisplay(timeLeft);
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]); } catch(e){}
          alert("Rest complete! Time for the next set.");
        }
      }, 1000);
    }

    function updateTimerDisplay(s) {
      var m = Math.floor(s / 60);
      var rem = s % 60;
      var minStr = m < 10 ? '0' + m : m;
      var secStr = rem < 10 ? '0' + rem : rem;
      document.getElementById('timer-display').innerText = minStr + ':' + secStr;
    }

    function updateChart() {
      if (typeof Chart === 'undefined') return; 

      var exName = document.getElementById('chart-exercise').value;
      var logs = getSafeLogs().reverse(); 
      
      var labels = [];
      var dataPoints = [];

      for (var i = 0; i < logs.length; i++) {
        var log = logs[i];
        if (log.type === 'workout' && log.exercises) {
          for (var j = 0; j < log.exercises.length; j++) {
            if (log.exercises[j].name.indexOf(exName) !== -1) {
              var ex = log.exercises[j];
              if (ex.weight) {
                var numWeight = parseFloat(ex.weight);
                if (!isNaN(numWeight)) {
                  labels.push(log.date.substring(5));
                  dataPoints.push(numWeight);
                }
              }
            }
          }
        }
      }

      if (progressChart) progressChart.destroy();

      var ctx = document.getElementById('progressChart').getContext('2d');
      progressChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length ? labels : ['No Data'],
          datasets: [{
            label: 'Load Progression',
            data: dataPoints.length ? dataPoints : [0],
            borderColor: '#8b5cf6',
            backgroundColor: 'rgba(139, 92, 246, 0.1)',
            borderWidth: 3,
            pointBackgroundColor: '#10b981',
            pointRadius: 4,
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { grid: { color: '#27272a' }, ticks: { color: '#a1a1aa' }, beginAtZero: false },
            x: { grid: { color: '#27272a' }, ticks: { col
