<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tracker">
  <title>Workout & Journal</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-active: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --highlight: #2dd4bf;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 90px; }
    header { padding: 24px 20px 12px; background: var(--card); border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.25rem; font-weight: 700; }
    .container { padding: 16px 20px; max-width: 500px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      width: 100%; background: #0b1120; border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 12px; font-size: 1rem; margin-bottom: 12px; outline: none;
    }
    input[type="range"] { width: 100%; margin: 8px 0; accent-color: var(--accent); }
    .checkbox-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; cursor: pointer; }
    .checkbox-row input { width: 20px; height: 20px; accent-color: var(--accent); }
    
    button.btn-primary {
      width: 100%; background: var(--accent); color: #0f172a; border: none; border-radius: 8px; padding: 14px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    button.btn-primary:active { background: var(--accent-active); }
    
    .nav-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-btn { background: none; border: none; color: var(--text-muted); font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    .nav-btn.active { color: var(--accent); font-weight: 700; }
    .history-item { border-left: 3px solid var(--accent); padding-left: 12px; margin-bottom: 14px; }

    .exercise-item { background: #0b1120; padding: 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; }
    .ex-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
    .ex-prev { font-size: 0.8rem; color: var(--highlight); margin-bottom: 8px; font-weight: 500; }
    .ex-inputs { display: flex; gap: 8px; }
    .ex-inputs input { margin-bottom: 0; padding: 8px; text-align: center; }
    .ex-inputs .input-group { flex: 1; display: flex; flex-direction: column; align-items: center; }
    .ex-inputs label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; letter-spacing: 0; }
  </style>
</head>
<body>

  <header>
    <h1 id="view-title">Log Workout</h1>
  </header>

  <div class="container">
    <!-- WORKOUT TAB -->
    <div id="tab-workout" class="tab-content active">
      <div class="card">
        <label>Date</label>
        <input type="date" id="workout-date">

        <label>Session Type</label>
        <select id="workout-split" onchange="renderExercises()">
          <option value="Morning Day A">☀️ Morning Day A (Upper Posture)</option>
          <option value="Morning Day B">☀️ Morning Day B (Lower Mobility/Core)</option>
          <option value="Gym Day A">🏋️ Gym Day A (Upper Posture/Core)</option>
          <option value="Gym Day B">🏋️ Gym Day B (Legs/Arms)</option>
          <option value="Recovery">Active Recovery / Rest</option>
        </select>
      </div>

      <div class="card" id="routine-container">
        <label>Routine Breakdown</label>
        <div id="exercise-list">
          <!-- Exercises will be injected here via JavaScript -->
        </div>
      </div>

      <div class="card">
        <label>Recovery Tracking</label>
        <div class="checkbox-row">
          <input type="checkbox" id="workout-swim">
          <span>Completed 30-min Recovery Swim</span>
        </div>
      </div>
      
      <button class="btn-primary" onclick="saveWorkout()">Save Workout</button>
    </div>

    <!-- JOURNAL TAB -->
    <div id="tab-journal" class="tab-content">
      <div class="card">
        <label>Date</label>
        <input type="date" id="journal-date">

        <label id="energy-label">Energy Level: 7/10</label>
        <input type="range" id="journal-energy" min="1" max="10" value="7" oninput="updateEnergy(this.value)">

        <label>Daily Reflection & Posture Log</label>
        <textarea id="journal-notes" rows="6" placeholder="Notes on posture, core tension, physical stamina, or mental focus..."></textarea>
      </div>
      <button class="btn-primary" onclick="saveJournal()">Save Journal Entry</button>
    </div>

    <!-- HISTORY TAB -->
    <div id="tab-history" class="tab-content">
      <div id="history-container"></div>
      <button class="btn-primary" style="background:#475569; margin-top: 10px;" onclick="exportData()">Export Data (JSON)</button>
    </div>
  </div>

  <nav class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('workout')">🏋️<span>Workout</span></button>
    <button class="nav-btn" onclick="switchTab('journal')">📖<span>Journal</span></button>
    <button class="nav-btn" onclick="switchTab('history')">📊<span>History</span></button>
  </nav>

  <script>
    // New Routines based on your specified template
    const routines = {
      "Morning Day A": [
        "Thoracic Spine Foam Rolling (Release)", 
        "Cat-Cow Stretches (Mobility)", 
        "Wall Angels (Mobility)", 
        "Banded Pull-Aparts (Activation)", 
        "Banded Face Pulls (Activation)"
      ],
      "Morning Day B": [
        "IT Band & Quad Foam Rolling (Release)", 
        "90/90 Hip Stretches (Mobility)", 
        "Glute Bridges (Mobility)", 
        "Banded Squats (Activation)", 
        "Forearm Plank (Activation)"
      ],
      "Gym Day A": [
        "Lat Pulldown Machine (Upper back width)", 
        "Cable Crossover / Low Row (Posture)", 
        "Plamax Machine Chest Press (Slow stretch)", 
        "Hyperextension Bench (Lower back endurance)", 
        "Incline Treadmill Walk (Leg/lung stamina)"
      ],
      "Gym Day B": [
        "Plamax Seated Leg Press (Foundational strength)", 
        "Dumbbell RDLs (Hamstring stretch)", 
        "Plamax Leg Curls (Knee stability)", 
        "Dumbbell Hammer Curls (Grip strength)", 
        "Elliptical Machine (Flush lactic acid)"
      ],
      "Recovery": []
    };

    let currentSplitExercises = [];

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('workout-date').value = today;
    document.getElementById('journal-date').value = today;

    renderExercises();

    function updateEnergy(val) {
      document.getElementById('energy-label').innerText = `Energy Level: ${val}/10`;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(`tab-${tab}`).classList.add('active');
      event.currentTarget.classList.add('active');
      
      const titles = { workout: 'Log Workout', journal: 'Daily Journal', history: 'Log History' };
      document.getElementById('view-title').innerText = titles[tab];

      if (tab === 'history') loadHistory();
    }

    function getLastWorkout(split) {
      const logs = JSON.parse(localStorage.getItem('logs') || '[]');
      return logs.find(log => log.type === 'workout' && log.split === split);
    }

    function renderExercises() {
      const split = document.getElementById('workout-split').value;
      const container = document.getElementById('exercise-list');
      const routineCard = document.getElementById('routine-container');
      
      currentSplitExercises = routines[split];

      if (currentSplitExercises.length === 0) {
        routineCard.style.display = 'none';
        return;
      }

      routineCard.style.display = 'block';
      const lastWorkout = getLastWorkout(split);
      let html = '';

      currentSplitExercises.forEach((ex, index) => {
        let prevText = "No previous data logged.";
        
        if (lastWorkout && lastWorkout.exercises) {
          const prevEx = lastWorkout.exercises.find(e => e.name === ex);
          if (prevEx && (prevEx.weight || prevEx.sets || prevEx.reps)) {
            prevText = `Last: ${prevEx.weight || '-'} | ${prevEx.sets || '-'} sets | ${prevEx.reps || '-'}`;
          }
        }

        html += `
          <div class="exercise-item">
            <div class="ex-name">${ex}</div>
            <div class="ex-prev">${prevText}</div>
            <div class="ex-inputs">
              <div class="input-group">
                <label>Load/Band</label>
                <input type="text" id="w-${index}" placeholder="-">
              </div>
              <div class="input-group">
                <label>Sets</label>
                <input type="number" id="s-${index}" placeholder="0">
              </div>
              <div class="input-group">
                <label>Reps/Time</label>
                <input type="text" id="r-${index}" placeholder="-">
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function saveWorkout() {
      const split = document.getElementById('workout-split').value;
      
      const exerciseData = [];
      if (split !== 'Recovery') {
        currentSplitExercises.forEach((ex, index) => {
          const weight = document.getElementById(`w-${index}`).value;
          const sets = document.getElementById(`s-${index}`).value;
          const reps = document.getElementById(`r-${index}`).value;
          if (weight || sets || reps) {
            exerciseData.push({ name: ex, weight, sets, reps });
          }
        });
      }

      const entry = {
        id: Date.now(),
        type: 'workout',
        date: document.getElementById('workout-date').value,
        split: split,
        exercises: exerciseData,
        swim: document.getElementById('workout-swim').checked
      };

      const logs = JSON.parse(localStorage.getItem('logs') || '[]');
      logs.unshift(entry);
      localStorage.setItem('logs', JSON.stringify(logs));

      renderExercises();
      document.getElementById('workout-swim').checked = false;
      alert('Workout saved locally!');
    }

    function saveJournal() {
      const entry = {
        id: Date.now(),
        type: 'journal',
        date: document.getElementById('journal-date').value,
        energy: document.getElementById('journal-energy').value,
        notes: document.getElementById('journal-notes').value
      };

      const logs = JSON.parse(localStorage.getItem('logs') || '[]');
      logs.unshift(entry);
      localStorage.setItem('logs', JSON.stringify(logs));

      document.getElementById('journal-notes').value = '';
      alert('Journal entry saved locally!');
    }

    function loadHistory() {
      const container = document.getElementById('history-container');
      const logs = JSON.parse(localStorage.getItem('logs') || '[]');
      
      if (logs.length === 0) {
        container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">No entries saved yet.</p>';
        return;
      }

      container.innerHTML = logs.map(item => {
        if (item.type === 'workout') {
          let exHtml = '';
          if (item.exercises && item.exercises.length > 0) {
            exHtml = item.exercises.map(e => 
              `<div>• <span style="color:#94a3b8">${e.name.split('(')[0].trim()}:</span> <strong>${e.weight || 'BW'}</strong> (${e.sets || '-'} x ${e.reps || '-'})</div>`
            ).join('');
          }

          return `
            <div class="card history-item">
              <div style="font-size:0.8rem; color:var(--text-muted);">${item.date} • WORKOUT</div>
              <strong style="color:var(--accent); display:block; margin: 4px 0;">${item.split}</strong>
              <div style="font-size:0.9rem; color:var(--text); line-height: 1.4;">${exHtml || 'No specific exercises logged'}</div>
              ${item.swim ? '<div style="margin-top:8px; font-size:0.85rem; color:#4ade80;">✓ 30-min Swim Logged</div>' : ''}
            </div>`;
        } else {
          return `
            <div class="card history-item" style="border-left-color: #a78bfa;">
              <div style="font-size:0.8rem; color:var(--text-muted);">${item.date} • JOURNAL</div>
              <strong style="display:block; margin: 4px 0;">Energy: ${item.energy}/10</strong>
              <p style="white-space:pre-wrap; font-size:0.9rem;">${item.notes || 'No notes'}</p>
            </div>`;
        }
      }).join('');
    }

    function exportData() {
      const data = localStorage.getItem('logs') || '[]';
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `fitness-log-export-${today}.json`;
      a.click();
    }
  </script>
</body>
</html>
